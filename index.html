<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T'fillah Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh;
    background: linear-gradient(180deg, #0C1530 0%, #111D3E 60%, #0C1530 100%);
    color: #F3EDDD; font-family: 'Spectral', Georgia, serif; padding-bottom: 170px; }
  .shell { max-width: 680px; margin: 0 auto; padding: 0 18px; }
  .header { text-align: center; padding: 30px 0 6px; }
  .kicker { display: block; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #C9A227; margin-bottom: 10px; }
  h1 { font-size: 34px; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
  .sub { font-size: 16px; font-style: italic; color: #A9B4CF; margin: 6px 0 0; font-weight: 300; }
  .rule { border: none; height: 1px; margin: 18px auto; max-width: 340px;
    background: linear-gradient(90deg, transparent, #C9A227 30%, #C9A227 70%, transparent); }
  .tabs { display: flex; border: 1px solid rgba(201,162,39,0.5); border-radius: 8px; overflow: hidden; margin: 4px 0 18px; }
  .tab { flex: 1; padding: 12px 4px; text-align: center; font: inherit; font-size: 10.5px; letter-spacing: 0.8px;
    text-transform: uppercase; color: #A9B4CF; background: transparent; border: none; cursor: pointer; line-height: 1.35; }
  .tab.on { background: #C9A227; color: #0C1530; font-weight: 600; }
  .viewdesc { text-align: center; font-size: 14.5px; color: #8D99B8; font-weight: 300; margin: 0 0 16px; }
  .toc { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 0 0 20px;
    background: rgba(246,241,227,0.04); border: 1px solid rgba(201,162,39,0.22); border-radius: 10px; padding: 14px 16px; }
  .tocitem { background: none; border: none; color: #F3EDDD; font: inherit; font-size: 15px; text-align: left;
    cursor: pointer; padding: 3px 0; }
  .tocitem:hover { color: #C9A227; }
  .tocitem span { color: #8D99B8; font-size: 11.5px; }
  .card { position: relative; width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: rgba(246,241,227,0.05); border: 1px solid rgba(201,162,39,0.22);
    border-radius: 10px; padding: 16px 44px 16px 18px; margin-bottom: 12px; cursor: pointer; text-align: left; }
  .card:hover { background: rgba(246,241,227,0.10); border-color: #C9A227; }
  .cname { font-size: 18.5px; font-weight: 600; margin: 0; }
  .cdesc { font-size: 14.5px; color: #A9B4CF; margin: 3px 0 0; max-width: 300px; font-weight: 300; }
  .pill { display: inline-block; font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #C9A227;
    border: 1px solid rgba(201,162,39,0.45); border-radius: 3px; padding: 2px 7px; margin-top: 7px; margin-right: 6px; }
  .pill.dim { color: #8D99B8; border-color: rgba(141,153,184,0.4); }
  .che { font-family: 'Frank Ruhl Libre', serif; font-size: 25px; color: #C9A227; margin-left: 12px; white-space: nowrap; direction: rtl; }
  .pinbtn { position: absolute; top: 10px; right: 10px; background: none; border: none; cursor: pointer;
    color: rgba(141,153,184,0.55); padding: 4px; }
  .pinbtn.on { color: #C9A227; }
  .back { background: none; border: none; color: #C9A227; font: inherit; font-size: 14px; cursor: pointer; padding: 18px 0 0; }
  .phead { text-align: center; padding: 8px 0 4px; }
  .phe { font-family: 'Frank Ruhl Libre', serif; font-size: 40px; font-weight: 700; color: #C9A227; margin: 0; direction: rtl; }
  .pen { font-size: 17px; margin: 4px 0 0; }
  .pdesc { font-size: 15px; color: #A9B4CF; font-style: italic; margin: 6px 0 0; font-weight: 300; }
  .hint { font-size: 14px; color: #8D99B8; text-align: center; margin: 14px 0 6px; font-weight: 300; }
  .trrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 6px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8D99B8; }
  .switch { position: relative; width: 46px; height: 26px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .knob { position: absolute; inset: 0; background: rgba(246,241,227,0.15); border: 1px solid rgba(201,162,39,0.5);
    border-radius: 13px; transition: background .2s; cursor: pointer; }
  .knob:before { content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px;
    background: #F3EDDD; border-radius: 50%; transition: transform .2s; }
  .switch input:checked + .knob { background: #C9A227; }
  .switch input:checked + .knob:before { transform: translateX(20px); }
  body.hide-tr .ph-tr { display: none; }
  .phrase { background: #F6F1E3; color: #1C2333; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px;
    border: 1px solid #E4DCC6; border-left: 4px solid transparent; border-right: 4px solid transparent;
    width: 100%; text-align: left; display: block; }
  .ph-he { font-family: 'Frank Ruhl Libre', serif; font-size: 38px; line-height: 1.75; direction: rtl; text-align: right;
    margin: 0; font-weight: 500; }
  .ph-tr { font-size: 16.5px; color: #5A6379; margin: 4px 0 0; font-style: italic; line-height: 1.5; font-weight: 300; }
  .fcount { text-align: center; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #8D99B8; margin: 4px 0 10px; }
  .phrase.fcur { text-align: center; padding: 22px 18px; }
  .phrase.fcur .ph-he { text-align: center; font-size: 46px; }
  .phrase.fnext { opacity: 0.4; transform: scale(0.94); }
  .fnav { display: flex; justify-content: center; gap: 14px; margin: 14px 0 6px; }
  .fbtn { background: rgba(246,241,227,0.08); color: #F3EDDD; border: 1px solid rgba(201,162,39,0.5);
    border-radius: 24px; padding: 13px 30px; font: inherit; font-size: 15px; cursor: pointer; }
  .fbtn:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 480px) { .phrase.fcur .ph-he { font-size: 39px; } }
  .player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(9,14,31,0.96); border-top: 1px solid rgba(201,162,39,0.5); }
  .pinner { max-width: 680px; margin: 0 auto; padding: 10px 18px 16px; display: flex; flex-direction: column; gap: 8px; }
  .seek { display: flex; align-items: center; gap: 10px; }
  .seek input { flex: 1; accent-color: #C9A227; }
  .time { font-size: 12px; color: #A9B4CF; min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; background: rgba(246,241,227,0.08);
    color: #F3EDDD; border: 1px solid rgba(201,162,39,0.45); border-radius: 50%;
    width: 44px; height: 44px; font-size: 15px; cursor: pointer; }
  .btn.play { width: 58px; height: 58px; background: #C9A227; color: #0C1530; }
  .rates { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .rates span { font-size: 12px; color: #A9B4CF; }
  .chip { background: rgba(246,241,227,0.08); color: #F3EDDD; border: 1px solid rgba(201,162,39,0.45);
    border-radius: 14px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .chip.on { background: #C9A227; color: #0C1530; font-weight: 600; }
  .sect { margin-top: 36px; }
  .secthead { text-align: center; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: #C9A227; margin: 0 0 4px; }
  .sectsub { text-align: center; font-size: 14.5px; color: #8D99B8; font-weight: 300; margin: 0 0 14px; }
  .tbl { width: 100%; border-collapse: collapse; background: #F6F1E3; color: #1C2333; border-radius: 10px; overflow: hidden; }
  .tblwrap { border-radius: 10px; overflow: hidden; border: 1px solid rgba(201,162,39,0.4); margin-bottom: 8px; }
  .tbl td { padding: 10px 14px; border-bottom: 1px solid #E4DCC6; font-size: 15.5px; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr.selrow { cursor: pointer; }
  .tbl tr.selrow:active td { background: #EFE3C2; }
  .tbl tr.sel td { background: #EFE3C2; }
  .tbl tr.sel td:first-child { box-shadow: inset 4px 0 0 #C9A227; }
  .deckbar { text-align: center; font-size: 12.5px; color: #8D99B8; margin: 10px 0 0; font-weight: 300; }
  .wheelitem { position: relative; padding-top: 16px; background: #F6F1E3; color: #1C2333; border: 1px solid rgba(201,162,39,0.4);
    border-radius: 10px; padding: 14px 44px 14px 16px; margin-bottom: 12px; }
  .wheelitem .wcol { display: flex; flex-direction: column; align-items: center; text-align: center; pointer-events: none; }
  .wheelitem .wsyll { font-family: 'Frank Ruhl Libre', serif; font-size: 150px; line-height: 1.0; margin-bottom: -38px; position: relative; z-index: 2; }
  .wheelitem .wname { position: absolute; top: 12px; left: 14px; font-size: 11.5px; color: #5A6379; letter-spacing: 0.5px; }
  .wheelitem .wctrl { position: absolute; top: 8px; right: 10px; display: flex; align-items: center; gap: 7px; }
  .wctrl-lbl { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: #5A6379; }
  .wheelitem .wctrl .pinbtn { position: static; }
  .switch.sm { width: 36px; height: 20px; }
  .switch.sm .knob:before { width: 14px; height: 14px; left: 2px; top: 2px; }
  .switch.sm input:checked + .knob:before { transform: translateX(16px); }
  .wheelitem.nosay .wsayarc { display: none; }
  .warc .warr { fill: rgba(201,162,39,0.8); }
  .warc { width: 100%; height: auto; display: block; margin-top: 6px; touch-action: none; cursor: pointer; }
  .warc path { stroke: rgba(201,162,39,0.55); stroke-width: 3; fill: none; stroke-linecap: round; }
  .warc .wtick text { font-family: 'Frank Ruhl Libre', serif; font-size: 48px; fill: #4A4234; pointer-events: none; }
  .warc .wtick.on text { font-size: 58px; fill: #A9750E; font-weight: 700; }
  .warc .wsayarc { font-family: 'Spectral', Georgia, serif; font-size: 44px; font-style: italic; fill: #8A6D1B; pointer-events: none; }
  .wheelitem .pinbtn { color: rgba(90,99,121,0.5); }
  .wheelitem .pinbtn.on { color: #A9750E; }
  .tbl .heb { font-family: 'Frank Ruhl Libre', serif; font-size: 31px; text-align: right; width: 64px; direction: rtl; }
  .tbl .nm { font-weight: 600; width: 40%; }
  .tbl .snd { color: #5A6379; font-style: italic; font-weight: 300; }
  .flashwrap { max-width: 340px; margin: 0 auto; }
  .flash { width: 100%; height: 210px; border-radius: 12px; cursor: pointer; border: 1px solid rgba(201,162,39,0.5);
    background: #F6F1E3; color: #1C2333; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: inherit; text-align: center; padding: 16px; }
  .flash .big { font-family: 'Frank Ruhl Libre', serif; font-size: 84px; line-height: 1.1; }
  .flash .vname { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .flash .vsound { font-size: 16px; color: #5A6379; }
  .flashnav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
  .flashcount { font-size: 12px; color: #8D99B8; min-width: 60px; text-align: center; }
  .footer { margin-top: 46px; padding-top: 18px; border-top: 1px solid rgba(201,162,39,0.25);
    text-align: center; font-size: 13.5px; color: #8D99B8; font-weight: 300; line-height: 1.7; }
  .footer a { color: #C9A227; text-decoration: none; }
  @media (max-width: 480px) { .ph-he { font-size: 33px; } .che { font-size: 21px; } .tab { font-size: 9.5px; } }
</style>
</head>
<body>
<div class="shell" id="root">
  <div style="text-align:center; padding-top:38vh;">
    <span class="kicker">Temple Beth El</span>
    <h1 style="margin-top:4px;">T&rsquo;fillah Trainer</h1>
  </div>
</div>
<div class="player" id="playerbar" style="display:none">
  <div class="pinner">
    <div class="seek">
      <span class="time" id="tcur">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="0.1" value="0">
      <span class="time" id="tdur">0:00</span>
    </div>
    <div class="controls">
      <button class="btn" id="restart" title="Restart" aria-label="Restart"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg></button>
      <button class="btn" id="back5" title="Back 5 seconds" aria-label="Back 5 seconds">&minus;5s</button>
      <button class="btn play" id="playpause" aria-label="Play"></button>
    </div>
    <div class="rates">
      <span>Speed:</span>
      <button class="chip" data-rate="0.75">0.75&times;</button>
      <button class="chip" data-rate="0.9">0.9&times;</button>
      <button class="chip on" data-rate="1">Normal</button>
    </div>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<script>
const PREVIEW = false;

function wheelGeom() {
  const cx = 180, cy = -2, r = 150, rt = 186, a0 = 28, a1 = 152, n = WHEEL_VOWELS.length;
  const pt = (rad_, deg) => {
    const rad = deg * Math.PI / 180;
    return [cx + rad_ * Math.cos(rad), cy + rad_ * Math.sin(rad)];
  };
  const ticks = [];
  for (let i = 0; i < n; i++) {
    const deg = a0 + (a1 - a0) * i / (n - 1);
    ticks.push(pt(rt, deg)); // just beneath the curve
  }
  let d = '';
  for (let deg = a0; deg <= a1; deg += 4) {
    const [x, y] = pt(r, deg);
    d += (d ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  // arrowheads past each end of the curve
  const arrow = (endDeg, dir) => {
    const tip = pt(r, endDeg + 7 * dir);
    const b1 = pt(r - 11, endDeg + 1.5 * dir);
    const b2 = pt(r + 11, endDeg + 1.5 * dir);
    return '<polygon class="warr" points="' + tip[0].toFixed(1) + ',' + tip[1].toFixed(1) + ' ' +
      b1[0].toFixed(1) + ',' + b1[1].toFixed(1) + ' ' + b2[0].toFixed(1) + ',' + b2[1].toFixed(1) + '"></polygon>';
  };
  const arrows = arrow(a0, -1) + arrow(a1, 1);
  return { ticks, d, arrows };
}
const WGEOM = wheelGeom();

function wheelVowelLabel(v) {
  const [vm, vs, vn, suffix] = v;
  return suffix ? vm : '\u25CC' + vm; // dotted circle carries the bare vowel mark
}

function wheelSay(i) {
  const lc = WHEELS[i][1];
  const vs = WHEEL_VOWELS[wheelPos[i]][1];
  if (lc === '') return vs === "'" ? "'" : vs;
  return vs === "'" ? lc + "'" : lc + vs;
}

function wheelItemHtml(i) {
  const [lg, lc, ln] = WHEELS[i];
  const [vm, vs, vn] = WHEEL_VOWELS[wheelPos[i]];
  let ticksHtml = '';
  WGEOM.ticks.forEach(([x, y], vi) => {
    ticksHtml += '<g class="wtick' + (vi === wheelPos[i] ? ' on' : '') + '" data-v="' + vi + '">' +
      '<text x="' + x + '" y="' + (y + 15) + '" text-anchor="middle">' + wheelVowelLabel(WHEEL_VOWELS[vi]) + '</text></g>';
  });
  return '<div class="wheelitem' + (wheelSayOn[i] ? '' : ' nosay') + '" id="wh' + i + '">' +
    '<span class="wname" id="whn' + i + '">' + ln + ' + ' + vn + '</span>' +
    '<span class="wctrl">' +
    '<span class="wctrl-lbl">transliteration</span><label class="switch sm" title="Turns the phonetic pronunciation on and off"><input type="checkbox"' + (wheelSayOn[i] ? ' checked' : '') + ' onchange="toggleWheelSay(' + i + ', this.checked)"><span class="knob"></span></label>' +
    '<button class="pinbtn' + (wheelPins.has(i) ? ' on' : '') + '" title="Pin" aria-label="Pin" onclick="toggleWheelPin(event,' + i + ')">' + ICON_PIN + '</button>' +
    '</span>' +
    '<div class="wcol"><span class="wsyll" id="whs' + i + '">' + (lg + vm) + '</span></div>' +
    '<svg class="warc" viewBox="0 40 360 200" data-i="' + i + '">' +
    '<path d="' + WGEOM.d + '"></path>' + WGEOM.arrows + ticksHtml +
    '<text class="wsayarc" id="whp' + i + '" x="180" y="126" text-anchor="middle">&ldquo;' + wheelSay(i) + '&rdquo;</text>' +
    '</svg></div>';
}

function updateWheelDisplay(i) {
  const [lg, lc, ln] = WHEELS[i];
  const [vm, vs, vn] = WHEEL_VOWELS[wheelPos[i]];
  const s = document.getElementById('whs' + i);
  const n = document.getElementById('whn' + i);
  const p = document.getElementById('whp' + i);
  if (s) s.textContent = lg + vm;
  if (n) n.textContent = ln + ' + ' + vn;
  if (p) p.textContent = '\u201C' + wheelSay(i) + '\u201D';
  document.querySelectorAll('#wh' + i + ' .wtick').forEach((g) => {
    g.classList.toggle('on', parseInt(g.dataset.v, 10) === wheelPos[i]);
  });
}

function wireWheels() {
  document.querySelectorAll('.warc').forEach((svg) => {
    const i = parseInt(svg.dataset.i, 10);
    const handle = (e) => {
      if (e.pointerType === 'mouse' && e.buttons === 0) return;
      if (e.cancelable) e.preventDefault();
      const rect = svg.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (360 / rect.width);
      const py = 40 + (e.clientY - rect.top) * (200 / rect.height);
      let deg = Math.atan2(py + 2, px - 180) * 180 / Math.PI;
      if (deg < 0) deg = deg < -90 ? 152 : 28;
      deg = Math.max(28, Math.min(152, deg));
      const idx = Math.round((deg - 28) / ((152 - 28) / (WHEEL_VOWELS.length - 1)));
      if (idx !== wheelPos[i]) { wheelPos[i] = idx; updateWheelDisplay(i); }
    };
    svg.addEventListener('pointerdown', handle);
    svg.addEventListener('pointermove', handle);
    svg.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    svg.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  });
}

function renderDeckFlash() {
  const c = document.getElementById('dflash');
  const count = document.getElementById('dcount');
  if (!c) return;
  const items = deckItems();
  if (!items.length) return;
  if (!deckOrder.length || deckOrder.length !== items.length) deckOrder = items.map((_, i) => i);
  if (deckIdx >= items.length) deckIdx = 0;
  const it = items[deckOrder[deckIdx]];
  c.innerHTML = deckFlip
    ? '<span class="vname">' + it.n + '</span><span class="vsound">' + it.s + '</span>'
    : '<span class="big">' + it.g + '</span>';
  count.textContent = (deckIdx + 1) + ' of ' + items.length;
}

function wireAlefbet() {
  renderDeckFlash();
  const f = document.getElementById('dflash');
  if (f) {
    f.addEventListener('click', () => { deckFlip = !deckFlip; renderDeckFlash(); });
    document.getElementById('dnext').addEventListener('click', () => { deckIdx = (deckIdx + 1) % deckItems().length; deckFlip = false; renderDeckFlash(); });
    document.getElementById('dprev').addEventListener('click', () => { const n = deckItems().length; deckIdx = (deckIdx - 1 + n) % n; deckFlip = false; renderDeckFlash(); });
    document.getElementById('dshuffle').addEventListener('click', () => {
      for (let i = deckOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deckOrder[i], deckOrder[j]] = [deckOrder[j], deckOrder[i]];
      }
      deckIdx = 0; deckFlip = false; renderDeckFlash();
    });
    document.getElementById('dclear').addEventListener('click', () => { deck.clear(); saveDeck(); deckOrder = []; showList(true); });
  }
}
