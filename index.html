<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T'fillah Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');
  * { box-sizing: border-box; }
  /* Hebrew uses Times New Roman, the font in the class PDF; Frank Ruhl Libre is the backup on devices without it. */
  :root { --heb: 'Times New Roman', 'Frank Ruhl Libre', serif; }
  body { margin: 0; min-height: 100vh;
    background: linear-gradient(180deg, #0C1530 0%, #111D3E 60%, #0C1530 100%);
    color: #F3EDDD; font-family: 'Spectral', Georgia, serif; padding-bottom: 170px;
    padding-top: env(safe-area-inset-top, 0px); }
  .shell { max-width: 680px; margin: 0 auto; padding: 0 18px; }
  .header { text-align: center; padding: 30px 0 6px; }
  .kicker { display: block; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #C9A227; margin-bottom: 10px; }
  h1 { font-size: 34px; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
  .sub { font-size: 16px; font-style: italic; color: #A9B4CF; margin: 6px 0 0; font-weight: 300; }
  .rule { border: none; height: 1px; margin: 18px auto; max-width: 340px;
    background: linear-gradient(90deg, transparent, #C9A227 30%, #C9A227 70%, transparent); }
  .tabs { display: flex; border: 1px solid rgba(201,162,39,0.5); border-radius: 8px; overflow: hidden; margin: 4px 0 18px; }
  .tab { flex: 1; padding: 12px 4px; text-align: center; font: inherit; font-size: 10.5px; letter-spacing: 0.8px;
    text-transform: uppercase; color: #A9B4CF; background: transparent; border: none; cursor: pointer; line-height: 1.35; }
  .tab.on { background: #C9A227; color: #0C1530; font-weight: 600; }
  .viewdesc { text-align: center; font-size: 14.5px; color: #8D99B8; font-weight: 300; margin: 0 0 16px; }
  .toc { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 0 0 20px;
    background: rgba(246,241,227,0.04); border: 1px solid rgba(201,162,39,0.22); border-radius: 10px; padding: 14px 16px; }
  .tocitem { background: none; border: none; color: #F3EDDD; font: inherit; font-size: 15px; text-align: left;
    cursor: pointer; padding: 3px 0; }
  .tocitem:hover { color: #C9A227; }
  .tocitem span { color: #8D99B8; font-size: 11.5px; }
  .card { position: relative; width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: rgba(246,241,227,0.05); border: 1px solid rgba(201,162,39,0.22);

  .card:hover { background: rgba(246,241,227,0.10); border-color: #C9A227; }
  .cname { font-size: 18.5px; font-weight: 600; margin: 0; }
  .cdesc { font-size: 14.5px; color: #A9B4CF; margin: 3px 0 0; max-width: 300px; font-weight: 300; }
  .pill { display: inline-block; font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #C9A227;
    border: 1px solid rgba(201,162,39,0.45); border-radius: 3px; padding: 2px 7px; margin-top: 7px; margin-right: 6px; }
  .pill.dim { color: #8D99B8; border-color: rgba(141,153,184,0.4); }
  .che { font-family: var(--heb); font-size: 25px; color: #C9A227; margin-left: 12px; white-space: nowrap; direction: rtl; }
  .pinbtn { position: absolute; top: 10px; right: 10px; background: none; border: none; cursor: pointer;
    color: rgba(141,153,184,0.55); padding: 4px; }
  .pinbtn.on { color: #C9A227; }
  .back { background: none; border: none; color: #C9A227; font: inherit; font-size: 14px; cursor: pointer; padding: 18px 0 0; }
  .phead { text-align: center; padding: 8px 0 4px; }
  .phe { font-family: var(--heb); font-size: 40px; font-weight: 700; color: #C9A227; margin: 0; direction: rtl; }
  .pen { font-size: 17px; margin: 4px 0 0; }
  .pdesc { font-size: 15px; color: #A9B4CF; font-style: italic; margin: 6px 0 0; font-weight: 300; }
  .hint { font-size: 14px; color: #8D99B8; text-align: center; margin: 14px 0 6px; font-weight: 300; }
  .trrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0 6px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8D99B8; }
  .switch { position: relative; width: 46px; height: 26px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .knob { position: absolute; inset: 0; background: rgba(246,241,227,0.15); border: 1px solid rgba(201,162,39,0.5);
    border-radius: 13px; transition: background .2s; cursor: pointer; }
  .knob:before { content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px;
    background: #F3EDDD; border-radius: 50%; transition: transform .2s; }
  .switch input:checked + .knob { background: #C9A227; }
  .switch input:checked + .knob:before { transform: translateX(20px); }
  body.hide-tr .ph-tr { display: none; }
  .phrase.tr-off .ph-tr { display: none; }
  body.hide-tr .phrase.tr-on .ph-tr { display: block; }
  .phrase { cursor: pointer; }
  .phrase { background: #F6F1E3; color: #1C2333; border-radius: 8px; padding: 14px 18px; margin-bottom: 10px;
    border: 1px solid #E4DCC6; border-left: 4px solid transparent; border-right: 4px solid transparent;
    width: 100%; text-align: left; display: block; }
  .ph-he { font-family: var(--heb); font-size: 38px; line-height: 1.75; direction: rtl; text-align: right;
    margin: 0; font-weight: 500; }
  .phrase.strong .ph-he { font-weight: 700; }
  .ph-en { font-size: 16.5px; color: #3E4660; margin: 4px 0 0; line-height: 1.5; }
  .listen { background: rgba(246,241,227,0.05); border: 1px dashed rgba(201,162,39,0.4); border-radius: 10px;
    padding: 18px; text-align: center; color: #A9B4CF; font-size: 15.5px; line-height: 1.5; margin: 18px 0 6px; }
  .pblock { background: #F6F1E3; color: #1C2333; border: 1px solid #E4DCC6; border-radius: 8px;
    padding: 10px 18px 14px; margin-bottom: 10px; }
  .pblock .phrase { background: none; border: none; border-radius: 0; margin: 0; padding: 4px 0;
    -webkit-tap-highlight-color: transparent; }
  .ph-tr { font-size: 16.5px; color: #5A6379; margin: 4px 0 0; font-style: italic; line-height: 1.5; font-weight: 300; }
  .fcount { text-align: center; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #8D99B8; margin: 4px 0 10px; }
  .phrase.fcur { text-align: center; padding: 22px 18px; }
  .phrase.fcur .ph-he { text-align: center; font-size: 46px; }
  .phrase.fcur { touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
  .phrase.fcur.settle { transition: transform .16s ease-in, opacity .16s ease-in; }
  .phrase.fcur.in-next { animation: tt-in-next .2s ease-out; }
  .phrase.fcur.in-prev { animation: tt-in-prev .2s ease-out; }
  @keyframes tt-in-next { from { transform: translateX(48px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes tt-in-prev { from { transform: translateX(-48px); opacity: 0; } to { transform: none; opacity: 1; } }
  html.tt-lock, html.tt-lock body { overflow: hidden; overscroll-behavior: none; }
  .fbar { display: none; justify-content: space-between; align-items: center; gap: 12px; margin: 2px 0 14px; }
  .fbar .fbtn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; font-size: 15px;
    -webkit-tap-highlight-color: transparent; }
  .fbar .fbtn svg { flex: none; }
  .pblock .phrase.tt-here { border-radius: 6px; animation: tt-flash 1.8s ease-out; }
  @keyframes tt-flash { 0%, 35% { background: rgba(201,162,39,0.32); } 100% { background: rgba(201,162,39,0); } }
  @media (prefers-reduced-motion: reduce) {
    .pblock .phrase.tt-here { animation: none; background: rgba(201,162,39,0.25); } }
  .tdock { position: fixed; z-index: 25; right: max(12px, env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; padding: 4px; border-radius: 999px;
    background: rgba(12,21,48,0.94); border: 1px solid rgba(201,162,39,0.45);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .dchip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px 7px 12px; border-radius: 999px;
    font-size: 13.5px; color: #F3EDDD; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .dchip:has(input:focus-visible) { outline: 2px solid #C9A227; outline-offset: 1px; }
  /* when the player is showing, the dock becomes a tab joined to the player's top edge */
  .tdock.attached { border-radius: 14px 14px 0 0; border-bottom: none; box-shadow: none;
    background: rgba(9,14,31,0.96); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .ddiv { width: 1px; height: 22px; background: rgba(201,162,39,0.3); }
  @media (max-width: 360px) { .dchip { font-size: 12px; gap: 6px; padding: 6px 8px 6px 10px; } }
  .swipehint { display: flex; align-items: center; justify-content: center; gap: 8px; margin: -4px 0 12px;
    font-size: 14.5px; color: #C9A227; }
  .swipehint svg { flex: none; }
  @media (prefers-reduced-motion: reduce) {
    .phrase.fcur.in-next, .phrase.fcur.in-prev { animation: none; }
    .phrase.fcur.settle { transition: none; } }
  .fnav { display: flex; justify-content: center; gap: 14px; margin: 14px 0 6px; }
  .fbtn { background: rgba(246,241,227,0.08); color: #F3EDDD; border: 1px solid rgba(201,162,39,0.5);
    border-radius: 24px; padding: 13px 30px; font: inherit; font-size: 15px; cursor: pointer; }
  .fbtn:disabled { opacity: 0.35; cursor: default; }
  @media (max-width: 480px) { .phrase.fcur .ph-he { font-size: 39px; } }
  .player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(9,14,31,0.96); border-top: 1px solid rgba(201,162,39,0.5); }
  .pinner { max-width: 680px; margin: 0 auto; padding: 10px 18px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
  .seek { display: flex; align-items: center; gap: 10px; }
  .seek input { flex: 1; accent-color: #C9A227; }
  .time { font-size: 12px; color: #A9B4CF; min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; background: rgba(246,241,227,0.08);
    color: #F3EDDD; border: 1px solid rgba(201,162,39,0.45); border-radius: 50%;
    width: 44px; height: 44px; font-size: 15px; cursor: pointer; }
  .btn.play { width: 58px; height: 58px; background: #C9A227; color: #0C1530; }
  .rates { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .rates span { font-size: 12px; color: #A9B4CF; }
  .chip { background: rgba(246,241,227,0.08); color: #F3EDDD; border: 1px solid rgba(201,162,39,0.45);
    border-radius: 14px; padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .chip.on { background: #C9A227; color: #0C1530; font-weight: 600; }
  .sect { margin-top: 36px; }
  .secthead { text-align: center; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: #C9A227; margin: 0 0 4px; }
  .sectsub { text-align: center; font-size: 14.5px; color: #8D99B8; font-weight: 300; margin: 0 0 14px; }
  .tbl { width: 100%; border-collapse: collapse; background: #F6F1E3; color: #1C2333; border-radius: 10px; overflow: hidden; }
  .tblwrap { border-radius: 10px; overflow: hidden; border: 1px solid rgba(201,162,39,0.4); margin-bottom: 8px; }
  .tbl td { padding: 10px 14px; border-bottom: 1px solid #E4DCC6; font-size: 15.5px; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl tr.selrow { cursor: pointer; }
  .tbl tr.selrow:active td { background: #EFE3C2; }
  .tbl tr.sel td { background: #EFE3C2; }
  .tbl tr.sel td:first-child { box-shadow: inset 4px 0 0 #C9A227; }
  .deckbar { text-align: center; font-size: 12.5px; color: #8D99B8; margin: 10px 0 0; font-weight: 300; }
  .wheelitem { position: relative; padding-top: 16px; background: #F6F1E3; color: #1C2333; border: 1px solid rgba(201,162,39,0.4);
    border-radius: 10px; padding: 14px 44px 14px 16px; margin-bottom: 12px; }
  .wheelitem .wcol { display: flex; flex-direction: column; align-items: center; text-align: center; pointer-events: none; }
  .wheelitem .wsyll { font-family: var(--heb); font-size: 150px; line-height: 1.0; margin-bottom: -38px; position: relative; z-index: 2; }
  .wheelitem .wname { position: absolute; top: 12px; left: 14px; font-size: 11.5px; color: #5A6379; letter-spacing: 0.5px;
    max-width: 42%; line-height: 1.45; }
  .wheelitem .wname .wn-letter { display: block; font-weight: 600; color: #4A4234; }
  .wheelitem .wname .wn-vowel { display: block; font-size: 10.5px; color: #7A8296; }
  .wheelitem .wctrl { position: absolute; top: 8px; right: 10px; display: flex; flex-direction: column;
    align-items: flex-end; gap: 5px; }
  .wctrl-row { display: flex; align-items: center; gap: 7px; }
  .wctrl-lbl { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: #5A6379; }
  .finalctrl { display: flex; align-items: center; gap: 6px; background: rgba(169,117,14,0.12);
    border: 1px solid rgba(169,117,14,0.35); border-radius: 20px; padding: 2px 8px 2px 9px; }
  .finalctrl .flbl { font-size: 9px; letter-spacing: 0.8px; text-transform: uppercase; color: #5A6379; }
  .finalctrl .fglyph { font-family: var(--heb); font-size: 19px; color: #A9750E; line-height: 1;
    min-width: 15px; text-align: center; }
  /* cards that carry the extra final row need a little more headroom */
  .wheelitem.hasfinal .wsyll { margin-top: 16px; }
  .wheelitem .wctrl .pinbtn { position: static; }
  .switch.sm { width: 36px; height: 20px; }
  .switch.sm .knob:before { width: 14px; height: 14px; left: 2px; top: 2px; }
  .switch.sm input:checked + .knob:before { transform: translateX(16px); }
  .wheelitem.nosay .wsayarc { display: none; }
  .warc .warr { fill: rgba(201,162,39,0.8); }
  .warc { width: 100%; height: auto; display: block; margin-top: 6px; touch-action: none; cursor: pointer; }
  .warc path { stroke: rgba(201,162,39,0.55); stroke-width: 3; fill: none; stroke-linecap: round; }
  .warc .wtick text { font-family: var(--heb); font-size: 48px; fill: #4A4234; pointer-events: none; }
  .warc .wtick.on text { font-size: 58px; fill: #A9750E; font-weight: 700; }
  .warc .wsayarc { font-family: 'Spectral', Georgia, serif; font-size: 44px; font-style: italic; fill: #8A6D1B; pointer-events: none; }
  .wheelitem .pinbtn { color: rgba(90,99,121,0.5); }
  .wheelitem .pinbtn.on { color: #A9750E; }
  .tbl .heb { font-family: var(--heb); font-size: 31px; text-align: right; width: 64px; direction: rtl; }
  .tbl .nm { font-weight: 600; width: 40%; }
  .tbl .snd { color: #5A6379; font-style: italic; font-weight: 300; }
  .flashwrap { max-width: 340px; margin: 0 auto; }
  .flash { width: 100%; height: 210px; border-radius: 12px; cursor: pointer; border: 1px solid rgba(201,162,39,0.5);
    background: #F6F1E3; color: #1C2333; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: inherit; text-align: center; padding: 16px; }
  .flash .big { font-family: var(--heb); font-size: 84px; line-height: 1.1; }
  .flash .vname { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .flash .vsound { font-size: 16px; color: #5A6379; }
  .flashnav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
  .flashcount { font-size: 12px; color: #8D99B8; min-width: 60px; text-align: center; }
  .footer { margin-top: 46px; padding-top: 18px; border-top: 1px solid rgba(201,162,39,0.25);
    text-align: center; font-size: 13.5px; color: #8D99B8; font-weight: 300; line-height: 1.7; }
  .footer a { color: #C9A227; text-decoration: none; }
  @media (max-width: 480px) { .ph-he { font-size: 33px; } .che { font-size: 21px; } .tab { font-size: 9.5px; } }
  /* ---------- tabs: 3 across, 2 rows ---------- */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
  .tab { --tl: rgba(201,162,39,0.3); box-shadow: inset -1px 0 0 var(--tl), inset 0 -1px 0 var(--tl); }
  .tab:nth-child(3n) { box-shadow: inset 0 -1px 0 var(--tl); }
  .tab:nth-last-child(-n+3) { box-shadow: inset -1px 0 0 var(--tl); }
  .tab:nth-child(3n):nth-last-child(-n+3) { box-shadow: none; }

  /* ---------- Play All ---------- */
  .car { max-width: 520px; margin: 0 auto; }
  .cnow { background: #F6F1E3; color: #1C2333; border: 1px solid #E4DCC6; border-radius: 12px;
    padding: 16px 18px 14px; text-align: center; }
  .cpos { margin: 0; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #8A6D1B; }
  .cn-heb { margin: 6px 0 0; font-family: var(--heb); font-size: 40px; line-height: 1.25; direction: rtl; }
  .cn-name { margin: 2px 0 0; font-size: 20px; font-weight: 600; }
  .crep { margin: 4px 0 0; min-height: 1.3em; font-size: 14.5px; color: #5A6379; }
  .cseek { display: flex; align-items: center; gap: 10px; margin: 14px 2px 4px; font-size: 13px; color: #A9B4CF;
    font-variant-numeric: tabular-nums; }
  .cseek input { flex: 1; accent-color: #C9A227; height: 28px; }
  .cmain { display: flex; justify-content: center; margin: 6px 0 16px; }
  .cplay { width: 112px; height: 112px; border-radius: 50%; border: none; background: #C9A227; color: #0C1530;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,0.35); -webkit-tap-highlight-color: transparent; }
  .cplay:active { transform: scale(0.97); }
  .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cbtn { min-height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: rgba(246,241,227,0.07); color: #F3EDDD; border: 1px solid rgba(201,162,39,0.5); border-radius: 14px;
    font: inherit; font-size: 16px; cursor: pointer; padding: 10px 8px; -webkit-tap-highlight-color: transparent; }
  .cbtn svg { color: #C9A227; }
  .cbtn:active { background: rgba(201,162,39,0.18); }
  .cbtn:disabled { opacity: 0.35; cursor: default; }
  .creps { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 0;
    padding: 10px 10px 10px 16px; border: 1px solid rgba(201,162,39,0.5); border-radius: 14px;
    background: rgba(246,241,227,0.07); }
  .creps-l { font-size: 16px; }
  .creps-s { display: block; font-size: 13px; color: #A9B4CF; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .cstep { width: 54px; height: 54px; border-radius: 12px; border: 1px solid rgba(201,162,39,0.6);
    background: rgba(201,162,39,0.12); color: #F3EDDD; font: inherit; font-size: 28px; line-height: 1; cursor: pointer;
    -webkit-tap-highlight-color: transparent; }
  .cstep:disabled { opacity: 0.3; cursor: default; }
  .crepsv { min-width: 46px; text-align: center; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .clist { display: flex; flex-direction: column; gap: 6px; margin: 0 0 10px; }
  .citem { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 14px;
    background: rgba(246,241,227,0.05); color: #F3EDDD; border: 1px solid rgba(201,162,39,0.22); border-radius: 10px;
    font: inherit; font-size: 15.5px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .citem .cnum { width: 24px; flex: none; color: #8D99B8; font-size: 13px; font-variant-numeric: tabular-nums; }
  .citem .cnm { flex: 1; }
  .citem .chb { font-family: var(--heb); font-size: 19px; color: #C9A227; direction: rtl; }
  .citem.on { border-color: #C9A227; background: rgba(201,162,39,0.16); }
  .citem.on .cnum { color: #C9A227; }

  /* ---------- Vowel Quiz ---------- */
  .quiz { max-width: 480px; margin: 0 auto; }
  .qscore { display: flex; justify-content: center; gap: 10px; margin: 0 0 14px; }
  .qscore span { font-size: 14px; color: #A9B4CF; border: 1px solid rgba(201,162,39,0.35); border-radius: 999px; padding: 5px 14px; }
  .qscore b { color: #F3EDDD; font-variant-numeric: tabular-nums; }
  .qcard { background: #F6F1E3; color: #1C2333; border: 1px solid #E4DCC6; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; height: 210px; }
  .qglyph { font-family: var(--heb); font-size: 132px; line-height: 1; direction: rtl; }

const seek = document.getElementById('seek');
const tcur = document.getElementById('tcur');
const tdur = document.getElementById('tdur');
const playBtn = document.getElementById('playpause');
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_PIN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 3h12v2l-2 1v7l3 3v2h-6v5l-1 1-1-1v-5H5v-2l3-3V6L6 5V3z"/></svg>';
playBtn.innerHTML = ICON_PLAY;

const fmt = (s) => { if (!isFinite(s)) return '0:00'; const m = Math.floor(s/60), x = Math.floor(s%60); return m + ':' + (x<10?'0':'') + x; };
const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');


function headerHtml() {
  return (PREVIEW ? '<div style="text-align:center;background:#C9A227;color:#0C1530;font-size:12px;letter-spacing:1px;padding:6px 10px;border-radius:6px;margin:14px 0 0;">DESIGN PREVIEW &mdash; audio plays on the live site</div>' : '') +
    '<div class="header"><span class="kicker">Temple Beth El</span>' +
    "<h1>T'fillah Trainer</h1>" +
    '<p class="sub">Practice reading the Hebrew and sing along with your cantor</p></div>' +
    '<hr class="rule">';
}

function tabsHtml() {
  let h = '<div class="tabs">';
  for (const v in VIEWS) {
    h += '<button class="tab' + (v === currentView ? ' on' : '') + '" onclick="setView(\'' + v + '\')">' + VIEWS[v].label + '</button>';
  }
  return h + '</div>';
}

function setView(v) { currentView = v; showList(); }

function sortPinnedFirst(ids) {
  const arr = [...ids];
  arr.sort((a, b) => (pinned.has(b) ? 1 : 0) - (pinned.has(a) ? 1 : 0));
  return arr;
}

function footerHtml() {
  return '<div class="footer">This website is for practice only.<br>' +
    'Site is under construction. Please send any errors, feedback, or requests to ' +
    '<a href="mailto:ana.galvan345@gmail.com">ana.galvan345@gmail.com</a>.</div>';
}

function showList(keepScroll) {
  setPageLock(false);
  document.body.style.paddingBottom = '';
  const prevY = window.scrollY;
  audio.pause();
  bar.style.display = 'none';
  let html = headerHtml() + tabsHtml() +
    (VIEWS[currentView].desc ? '<p class="viewdesc">' + VIEWS[currentView].desc + '</p>' : '');

  if (currentView !== 'play') carStop();
  if (currentView === 'play') {
    html += carHtml() + footerHtml();
    root.innerHTML = html;
    carWire();
    window.scrollTo(0, keepScroll ? prevY : 0);
    if (!keepScroll) panelIntoView('.car', '.creps');
    return;
  }
  if (currentView === 'quiz') {
    html += quizHtml() + footerHtml();
    root.innerHTML = html;
    if (!quiz) quizNew();
    quizRender();
    window.scrollTo(0, keepScroll ? prevY : 0);
    if (!keepScroll) panelIntoView('.quiz', '.qnext');
    return;
  }
  if (currentView === 'alefbet') {
    html += alefbetHtml() + footerHtml();
    root.innerHTML = html;
    wireAlefbet();
    wireWheels();
    window.scrollTo(0, keepScroll ? prevY : 0);
    return;
  }

  if (currentView === 'siddur') {
    html += '<div class="toc">';
    for (const id of VIEWS.siddur.ids()) {
      const p = byId[id];
      if (!p) continue;
      html += '<button class="tocitem" onclick="showPrayer(\'' + id + '\')">' + esc(p.name) +
        (PAGES[id] ? ' <span>&middot; p.' + PAGES[id] + '</span>' : '') + '</button>';
    }
    html += '</div>';
  }

  for (const id of sortPinnedFirst(VIEWS[currentView].ids())) {
    const p = byId[id];
    if (!p) continue;
    const pagePill = '';
    const audioPill = (audioAvail.has(id) ? '<span class="pill">Audio</span>' : '') +
      (p.phrases.length ? '' : '<span class="pill dim">Listen only</span>');
    html += '<div class="card" role="button" tabindex="0" onclick="showPrayer(\'' + id + '\')">' +
      '<button class="pinbtn' + (pinned.has(id) ? ' on' : '') + '" title="Pin to top" aria-label="Pin to top" onclick="togglePin(event, \'' + id + '\')">' + ICON_PIN + '</button>' +
      '<span><span class="cname">' + esc(p.name) + '</span>' +
      '<span class="cdesc" style="display:block">' + esc(p.desc) + '</span>' +
      '<span style="display:block">' + pagePill + audioPill + '</span>' +
      '</span><span class="che">' + p.hebrewName + '</span></div>';
  }
  html += footerHtml();
  root.innerHTML = html;
  window.scrollTo(0, keepScroll ? prevY : 0);
}

function showPrayer(id) {
  setPageLock(false);
  carStop();
  requestAnimationFrame(placeDock);
  const p = byId[id];
  if (!p) return;
  currentPrayerId = id;
  focusIdx = 0;
  let html = '<button class="back" onclick="showList()">&larr; Back</button>' +
    '<div class="phead"><h2 class="phe">' + p.hebrewName + '</h2>' +
    '<p class="pen">' + esc(p.name) + '</p><p class="pdesc">' + esc(p.desc) + '</p></div>' +
    '<hr class="rule">';
  if (!p.phrases.length) {
    html += '<div class="listen">The class siddur doesn\u2019t include the words to this prayer. ' +
      'Use the recording below to listen and sing along.</div>';
  } else html +=
    '<div class="fbar" id="fbar">' +
    '<button class="fbtn" onclick="exitFocus()">' + ICON_BACK + 'Back</button>' +
    '<button class="fbtn" onclick="showList()">' + ICON_HOME + 'Home</button></div>' +
    '<p class="hint">Tap any line to show or hide its transliteration.</p>' +
    '<div id="pbody"></div>' + dockHtml(id);
  if (!audioAvail.has(id)) {
    html += '<p class="hint">The recording for this prayer is coming soon. For now, use it for reading practice.</p>';
  }
  html += footerHtml();
  root.innerHTML = html;
  document.body.classList.toggle('hide-tr', !showTr);
  const tt = document.getElementById('trtoggle');
  if (tt) tt.addEventListener('change', () => {
    showTr = tt.checked;
    document.querySelectorAll('#pbody .phrase').forEach((x) => x.classList.remove('tr-on', 'tr-off'));
    document.body.classList.toggle('hide-tr', !showTr);
  });
  const fm = document.getElementById('fmtoggle');
  if (fm) fm.addEventListener('change', () => {
    if (fm.checked) focusSet.add(currentPrayerId); else focusSet.delete(currentPrayerId);
    saveFocus();
    const wasLine = focusIdx;
    focusIdx = fm.checked ? readingLine() : 0; // start focus mode at the line being read
    renderPBody();
    if (!fm.checked) returnToLine(wasLine); // leaving focus mode: go to the line they were on
  });
  renderPBody();
  window.scrollTo(0, 0);
  if (!PREVIEW && audioAvail.has(id)) {
    audio.src = (window.AUDIO_SRC && window.AUDIO_SRC[id]) || (id + '.mp3');
    audio.playbackRate = currentRate;
    seek.value = 0; tcur.textContent = '0:00'; tdur.textContent = '0:00';
    bar.style.display = 'block';
  } else {
    bar.style.display = 'none';
  }
}

function phraseCardHtml(ph, cls) {
  // ph.tr = transliteration, ph.en = an English line printed in the PDF, ph.b = bold in the PDF
  const c = (cls ? ' ' + cls : '') + (ph.b ? ' strong' : '');
  return '<div class="phrase' + c + '" role="button" tabindex="0" onclick="toggleLineTr(this)">' +
    '<p class="ph-he">' + ph.he + '</p>' +
    (ph.tr ? '<p class="ph-tr">' + esc(ph.tr) + '</p>' : '') +
    (ph.en ? '<p class="ph-en">' + esc(ph.en) + '</p>' : '') + '</div>';
}

function toggleLineTr(el) {
  if (swipeLock) return; // a swipe just ended; don't treat it as a tap
  // Global switch sets the default; tapping a line overrides just that line.
  if (document.body.classList.contains('hide-tr')) el.classList.toggle('tr-on');
  else el.classList.toggle('tr-off');
  if (pageLocked) fitFocusCard();
}

function renderPBody() {
  const p = byId[currentPrayerId];
  const el = document.getElementById('pbody');
  if (!p || !el || !p.phrases.length) return;
  const fb = document.getElementById('fbar');
  if (fb) fb.style.display = focusSet.has(currentPrayerId) ? 'flex' : 'none';
  if (!focusSet.has(currentPrayerId)) {
    setPageLock(false);
    el.innerHTML = '<div class="pblock">' + p.phrases.map((ph) => phraseCardHtml(ph, '')).join('') + '</div>';
  } else {
    const n = p.phrases.length;
    focusIdx = Math.max(0, Math.min(focusIdx, n - 1));
    let h = '<p class="fcount">Line ' + (focusIdx + 1) + ' of ' + n + '</p>' +
      '<p class="swipehint">' + ICON_SWIPE_L + '<span>Swipe left for the next line, right to go back</span>' + ICON_SWIPE_R + '</p>' +
      phraseCardHtml(p.phrases[focusIdx], 'fcur');
    el.innerHTML = h;
    const card = el.querySelector('.phrase.fcur');
    if (card) {
      wireSwipe(card);
      if (focusEnter) card.classList.add(focusEnter > 0 ? 'in-next' : 'in-prev');
    }
    focusEnter = 0;
    requestAnimationFrame(lockFocusView);
  }
}

/* ---------- focus mode swipe ----------
   Swipe left = next line, swipe right = previous line.
   Vertical scrolling still works because the card only claims horizontal drags. */
const ICON_SWIPE_L = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>';
const ICON_SWIPE_R = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
let focusEnter = 0;
let swipeLock = false;

function wireSwipe(card) {
  let x0 = 0, y0 = 0, dx = 0, mode = null, pid = null;
  card.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null; pid = e.pointerId;
  });
  card.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!mode) {
      if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) {
        mode = 'h'; swipeLock = true;
        try { card.setPointerCapture(pid); } catch (err) {}
      } else if (Math.abs(my) > 10) { mode = 'v'; }
    }
    if (mode === 'h') {
      const n = byId[currentPrayerId].phrases.length;
      const atEnd = (mx > 0 && focusIdx === 0) || (mx < 0 && focusIdx === n - 1);
      dx = atEnd ? mx * 0.25 : mx; // resist at the first and last line
      card.style.transform = 'translateX(' + dx + 'px)';
    }
  });
  const end = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (mode !== 'h') { mode = null; return; }
    mode = null;
    const n = byId[currentPrayerId].phrases.length;
    const d = dx < -50 ? 1 : dx > 50 ? -1 : 0;
    const ok = d !== 0 && focusIdx + d >= 0 && focusIdx + d < n;
    card.classList.add('settle');
    if (ok) {
      card.style.transform = 'translateX(' + (d > 0 ? '-110%' : '110%') + ')';
      card.style.opacity = '0';
      setTimeout(() => { focusEnter = d; focusStep(d); }, 160);
    } else {
      card.style.transform = '';
    }
    setTimeout(() => { swipeLock = false; }, 60);
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

// Keyboard: left and right arrow keys also change lines in focus mode.
document.addEventListener('keydown', (e) => {
  if (!document.querySelector('#pbody .phrase.fcur')) return;
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  const n = byId[currentPrayerId].phrases.length;
  if (!d || focusIdx + d < 0 || focusIdx + d >= n) return;
  focusEnter = d; focusStep(d);
});

/* ---------- focus mode page lock ----------
   In focus mode the page stays still: it settles with the toggles at the top,
   then stops scrolling. Long lines shrink to fit above the player.
   Turning focus mode off (or going back) unlocks it. */
let pageLocked = false;
function setPageLock(on) {
  pageLocked = on;
  document.documentElement.classList.toggle('tt-lock', on);
  if (!on) document.body.style.minHeight = '';
}
// iPhone needs this as well as overflow:hidden. The audio player stays draggable.
document.addEventListener('touchmove', (e) => {
  if (pageLocked && !(e.target.closest && e.target.closest('.player'))) e.preventDefault();
}, { passive: false });

function fitFocusCard() {
  const card = document.querySelector('#pbody .phrase.fcur');
  if (!card) return;
  const he = card.querySelector('.ph-he');
  he.style.fontSize = '';
  const dock = document.getElementById('tdock');
  const limit = (dock ? dock.getBoundingClientRect().top
    : bar.style.display !== 'none' ? bar.getBoundingClientRect().top : window.innerHeight) - 12;
  let size = parseFloat(getComputedStyle(he).fontSize);
  while (card.getBoundingClientRect().bottom > limit && size > 22) {
    size -= 2;
    he.style.fontSize = size + 'px';
  }
}

function lockFocusView() {
  placeDock();
  if (!document.querySelector('#pbody .phrase.fcur')) return;
  setPageLock(false);
  const row = document.getElementById('fbar') || document.querySelector('.trrow');
  const target = row ? Math.max(0, row.getBoundingClientRect().top + window.scrollY - 12) : 0;
  // make the page tall enough to reach the same spot for every line, so it never jumps
  document.body.style.minHeight = (target + window.innerHeight) + 'px';
  window.scrollTo(0, target);
  fitFocusCard();
  setPageLock(true);
}
window.addEventListener('resize', () => { if (pageLocked) lockFocusView(); });
document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'trtoggle' && pageLocked) requestAnimationFrame(fitFocusCard);
});

const ICON_BACK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>';
const ICON_HOME = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>';

// Focus mode Back: turn focus mode off and bring the user to the line they were on.
// Both the Back button and the Focus mode switch go through the switch's change handler,
// which calls returnToLine, so they behave the same.
function exitFocus() {
  const fm = document.getElementById('fmtoggle');
  if (fm && fm.checked) { fm.checked = false; fm.dispatchEvent(new Event('change')); }
}
// Scroll the full prayer to a line and briefly highlight it.
function returnToLine(line) {
  requestAnimationFrame(() => {
    const el = document.querySelectorAll('#pbody .pblock .phrase')[line];
    if (!el) return;
    window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.3));
    lastReturn = { id: currentPrayerId, line, y: window.scrollY };
    el.classList.remove('tt-here'); void el.offsetWidth; el.classList.add('tt-here');
    setTimeout(() => el.classList.remove('tt-here'), 1900);
  });
}

/* ---------- toggle dock ----------
   Transliteration and Focus mode stay reachable while scrolling: a small dock sits just
   above the audio player (or at the bottom of the screen when there's no recording). */
function dockHtml(id) {
  return '<div class="tdock" id="tdock" role="group" aria-label="Display options">' +
    '<label class="dchip"><span>Transliteration</span><span class="switch sm"><input type="checkbox" id="trtoggle"' +
    (showTr ? ' checked' : '') + '><span class="knob"></span></span></label>' +
    '<span class="ddiv" aria-hidden="true"></span>' +
    '<label class="dchip"><span>Focus mode</span><span class="switch sm"><input type="checkbox" id="fmtoggle"' +
    (focusSet.has(id) ? ' checked' : '') + '><span class="knob"></span></span></label>' +
    '</div>';
}
function placeDock() {
  const d = document.getElementById('tdock');
  if (!d) { document.body.style.paddingBottom = ''; return; }
  const barOn = bar.style.display !== 'none';
  d.classList.toggle('attached', barOn);
  d.style.bottom = barOn ? (bar.offsetHeight - 1) + 'px' : ''; // overlap the player's top line by 1px
  // leave room so the last line can scroll clear of the dock and player
  document.body.style.paddingBottom = ((barOn ? bar.offsetHeight : 14) + d.offsetHeight + 24) + 'px';
}
window.addEventListener('resize', placeDock);
// The line nearest the top of the reading area, so focus mode opens where the reader is.
let lastReturn = null;
function readingLine() {
  // if they haven't scrolled since leaving focus mode, pick up exactly where they left off
  if (lastReturn && lastReturn.id === currentPrayerId && Math.abs(window.scrollY - lastReturn.y) < 4) return lastReturn.line;
  const lines = document.querySelectorAll('#pbody .pblock .phrase');
  const mark = window.innerHeight * 0.3 + 2; // same spot returnToLine puts a line
  for (let i = 0; i < lines.length; i++) if (lines[i].getBoundingClientRect().bottom > mark) return i;
  return Math.max(0, lines.length - 1);
}

function focusStep(d) {
  focusIdx += d;
  renderPBody();
}


/* ---------- Alef Bet tab ---------- */

// [glyph, sound, name] plus optional [finalGlyph, finalName] for letters
// that have a final (sofit) form.
const WHEELS = [
  ["\u05D0","","Alef"],["\u05D1\u05BC","b","Bet"],["\u05D1","v","Vet"],["\u05D2","g","Gimel"],
  ["\u05D3","d","Dalet"],["\u05D4","h","Hei"],["\u05D5","v","Vav"],["\u05D6","z","Zayin"],
  ["\u05D7","ch","Chet"],["\u05D8","t","Tet"],["\u05D9","y","Yod"],["\u05DB\u05BC","k","Kaf"],
  ["\u05DB","ch","Chaf","\u05DA","Final Chaf"],["\u05DC","l","Lamed"],
  ["\u05DE","m","Mem","\u05DD","Final Mem"],["\u05E0","n","Nun","\u05DF","Final Nun"],
  ["\u05E1","s","Samech"],["\u05E2","","Ayin"],["\u05E4\u05BC","p","Pei"],
  ["\u05E4","f","Fei","\u05E3","Final Fei"],
  ["\u05E6","tz","Tzadi","\u05E5","Final Tzadi"],["\u05E7","k","Kof"],["\u05E8","r","Reish"],["\u05E9\u05C1","sh","Shin"],
  ["\u05E9\u05C2","s","Sin"],["\u05EA","t","Tav"],
];
let wheelPos = WHEELS.map(() => 0);
let wheelSayOn = WHEELS.map(() => true);
let wheelFinal = WHEELS.map(() => false); // false = regular form, true = final form

// Helpers: a wheel has a final form when the row carries a 4th entry.
function wheelHasFinal(i) { return WHEELS[i].length > 3; }
function wheelGlyph(i) { return wheelFinal[i] ? WHEELS[i][3] : WHEELS[i][0]; }
function wheelAltGlyph(i) { return wheelFinal[i] ? WHEELS[i][0] : WHEELS[i][3]; }
function wheelName(i) { return wheelFinal[i] ? WHEELS[i][4] : WHEELS[i][2]; }

function toggleWheelFinal(i, v) {
  wheelFinal[i] = v;
  const wrap = document.getElementById('wh' + i);
  if (!wrap) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = wheelItemHtml(i);
  wrap.replaceWith(tmp.firstChild);
  wireOneWheel(i);
}
function toggleWheelSay(i, v) {
  wheelSayOn[i] = v;
  const el = document.getElementById('wh' + i);
  if (el) el.classList.toggle('nosay', !v);
}
let wheelPins = new Set();
try { wheelPins = new Set(JSON.parse(localStorage.getItem('tt-wpins') || '[]')); } catch (e) {}
function saveWheelPins() { try { localStorage.setItem('tt-wpins', JSON.stringify([...wheelPins])); } catch (e) {} }

let deck = new Set();
try { deck = new Set(JSON.parse(localStorage.getItem('tt-deck') || '[]')); } catch (e) {}
function saveDeck() { try { localStorage.setItem('tt-deck', JSON.stringify([...deck])); } catch (e) {} }
let deckIdx = 0, deckFlip = false, deckOrder = [];

function deckItems() {
  const items = [];
  ALEFBET.forEach(([g, n, s], i) => { if (deck.has('L' + i)) items.push({ g, n, s }); });
  VOWELS.forEach(([g, n, s], i) => { if (deck.has('V' + i)) items.push({ g, n, s }); });
  return items;
}

function toggleDeck(kind, i) {
  const key = kind + i;
  if (deck.has(key)) deck.delete(key); else deck.add(key);
  saveDeck();
  deckIdx = 0; deckFlip = false; deckOrder = [];
  showList(true);
}

function alefbetHtml() {
  let h = '<div style="text-align:center;margin:0 0 14px;"><button class="chip" onclick="document.getElementById(\'practice\').scrollIntoView({behavior:\'smooth\'})">Jump to practice section</button></div>' +
    '<div class="sect" style="margin-top:10px;"><p class="secthead">The Alef Bet</p>' +
    '<p class="sectsub">Tap any row to add it to your practice deck.</p><div class="tblwrap"><table class="tbl">';
  ALEFBET.forEach(([g, n, s], i) => {
    h += '<tr class="selrow' + (deck.has('L' + i) ? ' sel' : '') + '" onclick="toggleDeck(\'L\',' + i + ')">' +
      '<td class="heb">' + g + '</td><td class="nm">' + n + '</td><td class="snd">' + s + '</td></tr>';
  });
  h += '</table></div></div>';

  h += '<div class="sect"><p class="secthead">The Vowels</p>' +
    '<p class="sectsub">Shown with the letter Bet. Tap any row to add it to your practice deck.</p><div class="tblwrap"><table class="tbl">';
  VOWELS.forEach(([g, n, s], i) => {
    h += '<tr class="selrow' + (deck.has('V' + i) ? ' sel' : '') + '" onclick="toggleDeck(\'V\',' + i + ')">' +
      '<td class="heb">' + g + '</td><td class="nm">' + n + '</td><td class="snd">' + s + '</td></tr>';
  });
  h += '</table></div></div>';

  h += '<hr class="rule"><div class="sect" id="practice">';

  // Flashcards from the personalized deck
  const items = deckItems();
  h += '<div class="sect" style="margin-top:18px;"><p class="secthead" style="font-size:11px;">Flashcards</p>';
  if (items.length === 0) {
    h += '<p class="sectsub">Your deck is empty. Tap letters and vowels in the tables above to build it.</p>';
  } else {
    h += '<p class="deckbar">Your deck: ' + items.length + ' card' + (items.length > 1 ? 's' : '') + '. Tap the card to flip.</p>' +
      '<div class="flashwrap"><button class="flash" id="dflash"></button>' +
      '<div class="flashnav"><button class="chip" id="dprev">Previous</button>' +
      '<span class="flashcount" id="dcount"></span>' +
      '<button class="chip" id="dnext">Next</button></div>' +
      '<div class="flashnav"><button class="chip" id="dshuffle">Shuffle</button>' +
      '<button class="chip" id="dclear">Clear deck</button></div></div>';
  }
  h += '</div>';

  // Per-letter wheels with vowel sliders
  h += '<div class="sect"><p class="secthead" style="font-size:11px;">Alef Bet Wheels</p>' +
    '<p class="sectsub">One wheel per letter. Run your finger along the curve to spin through the vowels, just like the paper wheels. Pin your tricky letters to the top.</p>';
  const order = WHEELS.map((_, i) => i).sort((a, b) => (wheelPins.has(b) ? 1 : 0) - (wheelPins.has(a) ? 1 : 0));
  for (const i of order) {
    h += wheelItemHtml(i);
  }
  h += '</div></div>';
  return h;
}

function wheelGeom() {
  const cx = 180, cy = -2, r = 150, rt = 186, a0 = 28, a1 = 152, n = WHEEL_VOWELS.length;
  const pt = (rad_, deg) => {
    const rad = deg * Math.PI / 180;
    return [cx + rad_ * Math.cos(rad), cy + rad_ * Math.sin(rad)];
  };
  const ticks = [];
  for (let i = 0; i < n; i++) {
    const deg = a0 + (a1 - a0) * i / (n - 1);
    ticks.push(pt(rt, deg)); // just beneath the curve
  }
  let d = '';
  for (let deg = a0; deg <= a1; deg += 4) {
    const [x, y] = pt(r, deg);
    d += (d ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  // arrowheads past each end of the curve
  const arrow = (endDeg, dir) => {
    const tip = pt(r, endDeg + 7 * dir);
    const b1 = pt(r - 11, endDeg + 1.5 * dir);
    const b2 = pt(r + 11, endDeg + 1.5 * dir);
    return '<polygon class="warr" points="' + tip[0].toFixed(1) + ',' + tip[1].toFixed(1) + ' ' +
      b1[0].toFixed(1) + ',' + b1[1].toFixed(1) + ' ' + b2[0].toFixed(1) + ',' + b2[1].toFixed(1) + '"></polygon>';
  };
  const arrows = arrow(a0, -1) + arrow(a1, 1);
  return { ticks, d, arrows };
}
const WGEOM = wheelGeom();

function wheelVowelLabel(v) {
  const [vm, vs, vn, suffix] = v;
  return suffix ? vm : '\u25CC' + vm; // dotted circle carries the bare vowel mark
}

function wheelSay(i) {
  const lc = WHEELS[i][1];
  const vs = WHEEL_VOWELS[wheelPos[i]][1];
  if (lc === '') return vs === "'" ? "'" : vs;
  return vs === "'" ? lc + "'" : lc + vs;
}

function wheelItemHtml(i) {
  const [vm, vs, vn] = WHEEL_VOWELS[wheelPos[i]];
  let ticksHtml = '';
  WGEOM.ticks.forEach(([x, y], vi) => {
    ticksHtml += '<g class="wtick' + (vi === wheelPos[i] ? ' on' : '') + '" data-v="' + vi + '">' +
      '<text x="' + x + '" y="' + (y + 15) + '" text-anchor="middle">' + wheelVowelLabel(WHEEL_VOWELS[vi]) + '</text></g>';
  });
  const finalCtrl = wheelHasFinal(i)
    ? '<span class="finalctrl"><span class="flbl">reg</span>' +
      '<label class="switch sm" title="Switch between the regular and final form"><input type="checkbox"' + (wheelFinal[i] ? ' checked' : '') + ' onchange="toggleWheelFinal(' + i + ', this.checked)"><span class="knob"></span></label>' +
      '<span class="flbl">final</span><span class="fglyph">' + wheelAltGlyph(i) + '</span></span>'
    : '';
  return '<div class="wheelitem' + (wheelSayOn[i] ? '' : ' nosay') + (wheelHasFinal(i) ? ' hasfinal' : '') + '" id="wh' + i + '">' +
    '<span class="wname" id="whn' + i + '"><span class="wn-letter">' + wheelName(i) + '</span><span class="wn-vowel">' + vn + '</span></span>' +
    '<span class="wctrl">' +
    '<span class="wctrl-row">' +
    '<span class="wctrl-lbl">transliteration</span><label class="switch sm" title="Turns the phonetic pronunciation on and off"><input type="checkbox"' + (wheelSayOn[i] ? ' checked' : '') + ' onchange="toggleWheelSay(' + i + ', this.checked)"><span class="knob"></span></label>' +
    '<button class="pinbtn' + (wheelPins.has(i) ? ' on' : '') + '" title="Pin" aria-label="Pin" onclick="toggleWheelPin(event,' + i + ')">' + ICON_PIN + '</button>' +
    '</span>' + finalCtrl +
    '</span>' +
    '<div class="wcol"><span class="wsyll" id="whs' + i + '">' + (wheelGlyph(i) + vm) + '</span></div>' +
    '<svg class="warc" viewBox="0 40 360 200" data-i="' + i + '">' +
    '<path d="' + WGEOM.d + '"></path>' + WGEOM.arrows + ticksHtml +
    '<text class="wsayarc" id="whp' + i + '" x="180" y="126" text-anchor="middle">&ldquo;' + wheelSay(i) + '&rdquo;</text>' +
    '</svg></div>';
}

function updateWheelDisplay(i) {
  const [vm, vs, vn] = WHEEL_VOWELS[wheelPos[i]];
  const s = document.getElementById('whs' + i);
  const n = document.getElementById('whn' + i);
  const p = document.getElementById('whp' + i);
  if (s) s.textContent = wheelGlyph(i) + vm;
  if (n) n.innerHTML = '<span class="wn-letter">' + wheelName(i) + '</span><span class="wn-vowel">' + vn + '</span>';
  if (p) p.textContent = '\u201C' + wheelSay(i) + '\u201D';
  document.querySelectorAll('#wh' + i + ' .wtick').forEach((g) => {
    g.classList.toggle('on', parseInt(g.dataset.v, 10) === wheelPos[i]);
  });
}

function wireOneWheel(i) {
  const svg = document.querySelector('#wh' + i + ' .warc');
  if (!svg) return;
  const handle = (e) => {
    if (e.pointerType === 'mouse' && e.buttons === 0) return;
    if (e.cancelable) e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (360 / rect.width);
    const py = 40 + (e.clientY - rect.top) * (200 / rect.height);
    let deg = Math.atan2(py + 2, px - 180) * 180 / Math.PI;
    if (deg < 0) deg = deg < -90 ? 152 : 28;
    deg = Math.max(28, Math.min(152, deg));
    const idx = Math.round((deg - 28) / ((152 - 28) / (WHEEL_VOWELS.length - 1)));
    if (idx !== wheelPos[i]) { wheelPos[i] = idx; updateWheelDisplay(i); }
  };
  svg.addEventListener('pointerdown', handle);
  svg.addEventListener('pointermove', handle);
  svg.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  svg.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
}

function wireWheels() {
  document.querySelectorAll('.warc').forEach((svg) => {
    wireOneWheel(parseInt(svg.dataset.i, 10));
  });
}


function toggleWheelPin(ev, i) {

function renderDeckFlash() {
  const c = document.getElementById('dflash');
  const count = document.getElementById('dcount');
  if (!c) return;
  const items = deckItems();
  if (!items.length) return;
  if (!deckOrder.length || deckOrder.length !== items.length) deckOrder = items.map((_, i) => i);
  if (deckIdx >= items.length) deckIdx = 0;
  const it = items[deckOrder[deckIdx]];
  c.innerHTML = deckFlip
    ? '<span class="vname">' + it.n + '</span><span class="vsound">' + it.s + '</span>'
    : '<span class="big">' + it.g + '</span>';
  count.textContent = (deckIdx + 1) + ' of ' + items.length;
}

function wireAlefbet() {
  renderDeckFlash();
  const f = document.getElementById('dflash');
  if (f) {
    f.addEventListener('click', () => { deckFlip = !deckFlip; renderDeckFlash(); });
    document.getElementById('dnext').addEventListener('click', () => { deckIdx = (deckIdx + 1) % deckItems().length; deckFlip = false; renderDeckFlash(); });
    document.getElementById('dprev').addEventListener('click', () => { const n = deckItems().length; deckIdx = (deckIdx - 1 + n) % n; deckFlip = false; renderDeckFlash(); });
    document.getElementById('dshuffle').addEventListener('click', () => {
      for (let i = deckOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deckOrder[i], deckOrder[j]] = [deckOrder[j], deckOrder[i]];
      }
      deckIdx = 0; deckFlip = false; renderDeckFlash();
    });
    document.getElementById('dclear').addEventListener('click', () => { deck.clear(); saveDeck(); deckOrder = []; showList(true); });
  }
}

/* ================================================================
   PLAY ALL: every recording, one after another (made for the car).
   Uses its own audio element so it never fights the prayer-page player.
   ================================================================ */
const carAudio = new Audio();
carAudio.preload = 'auto';
let carIdx = 0;          // position in the playlist
let carPlay = 1;         // which repeat of the current prayer is playing
let carReps = 1;         // how many times to play each prayer in a row
try { carReps = Math.min(10, Math.max(1, parseInt(localStorage.getItem('tt-carreps') || '1', 10) || 1)); } catch (e) {}
let carDone = false;     // reached the end of the playlist
let carLoadedId = null;
let carSeeking = false;
let carWake = null;
let carListIdxShown = -1;
// 'all' = every recording; 'mine' = the user's own playlist (saved on this device)
let carMode = 'all';
try { if (localStorage.getItem('tt-carmode') === 'mine') carMode = 'mine'; } catch (e) {}
let carMine = new Set();
try { carMine = new Set(JSON.parse(localStorage.getItem('tt-carmine') || '[]')); } catch (e) {}

let carEditing = false;

const CI = (d, size, fill) => '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="' + (fill ? 'currentColor' : 'none') +
  '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const CAR_PLAY = CI('<path d="M7 4.5v15l13-7.5z"/>', 46, true);
const CAR_PAUSE = CI('<rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/>', 46, true);
const CAR_BACK10 = '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>' +
  '<text x="12.5" y="15.6" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none" font-family="Arial, sans-serif">10</text></svg>';
const CAR_RESTART = CI('<path d="M6 5v14"/><path d="M19 5L9 12l10 7z"/>', 32, false);
const CAR_NEXT = CI('<path d="M18 5v14"/><path d="M5 5l10 7-10 7z"/>', 32, false);
const CAR_ALL = CI('<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/><path d="M9 9l6 3-6 3z"/>', 32, false);

function carAll() { return DATA.service.filter((id) => audioAvail.has(id) && byId[id]); }
// My playlist always plays in service order.
function carList() { const all = carAll(); return carMode === 'mine' ? all.filter((id) => carMine.has(id)) : all; }
function carSrc(id) { return (window.AUDIO_SRC && window.AUDIO_SRC[id]) || (id + '.mp3'); }

function carLoad(i, play) {
  const list = carList();
  if (!list.length) return;
  carIdx = Math.max(0, Math.min(i, list.length - 1));
  carPlay = 1;
  carDone = false;
  const id = list[carIdx];
  if (carLoadedId !== id) { carAudio.src = carSrc(id); carLoadedId = id; }
  else { try { carAudio.currentTime = 0; } catch (e) {} }
  carMedia();
  if (play) carStart(); else carUpdate();
}
function carStart() {
  if (!carList().length) return;
  if (carDone) { carLoad(0, false); }
  else if (!carLoadedId) { carLoad(carIdx, false); }
  const p = carAudio.play();
  if (p && p.catch) p.catch(() => {});
  carKeepAwake(true);
  carHandlers(true);
  carUpdate();
}
function carPause() { carAudio.pause(); carKeepAwake(false); carUpdate(); }
function carToggle() { if (carAudio.paused) carStart(); else carPause(); }
function carBack10() { try { carAudio.currentTime = Math.max(0, carAudio.currentTime - 10); } catch (e) {} carUpdate(); }
function carRestartPrayer() { try { carAudio.currentTime = 0; } catch (e) {} if (carAudio.paused) carStart(); }
function carNext() { if (carIdx < carList().length - 1) carLoad(carIdx + 1, true); }
function carRestartAll() { if (carList().length) carLoad(0, true); }
function carSetReps(d) {
  carReps = Math.min(10, Math.max(1, carReps + d));
  try { localStorage.setItem('tt-carreps', String(carReps)); } catch (e) {}
  carUpdate();
}
// Leaving the tab (or opening a prayer) pauses the playlist; it resumes where it was.
function carStop() {
  if (!carAudio.paused) carAudio.pause();
  carKeepAwake(false);
  carHandlers(false);
}

carAudio.addEventListener('ended', () => {
  if (carPlay < carReps) {             // play the same prayer again
    carPlay++;
    try { carAudio.currentTime = 0; } catch (e) {}
    const p = carAudio.play(); if (p && p.catch) p.catch(() => {});
  } else if (carIdx < carList().length - 1) {
    carLoad(carIdx + 1, true);         // on to the next prayer
    return;
  } else {
    carDone = true;                    // end of the playlist
    carKeepAwake(false);
  }
  carUpdate();
});
['play', 'pause', 'loadedmetadata', 'durationchange'].forEach((ev) => carAudio.addEventListener(ev, carUpdate));
carAudio.addEventListener('timeupdate', carTime);

function carTime() {
  const s = document.getElementById('cseek');
  if (!s) return;
  const d = isFinite(carAudio.duration) ? carAudio.duration : 0;
  s.max = d || 0;
  if (!carSeeking) s.value = carAudio.currentTime || 0;
  document.getElementById('ccur').textContent = fmt(carAudio.currentTime || 0);
  document.getElementById('cdur').textContent = fmt(d);
}

function carUpdate() {
  const list = carList();
  const id = list[carIdx];
  const p = id ? byId[id] : null;
  const $ = (x) => document.getElementById(x);
  if (!$('cplay')) return;
  const empty = !list.length;
  $('cpos').textContent = empty ? 'My playlist' : carDone ? 'Playlist finished' : 'Prayer ' + (carIdx + 1) + ' of ' + list.length;
  $('cheb').innerHTML = p ? p.hebrewName : '';
  $('cnm').textContent = empty ? 'Your playlist is empty' : p ? p.name : '';
  document.querySelectorAll('.car .cplay, .car .cbtn').forEach((b) => { b.disabled = empty; });
  $('crep').textContent = empty ? 'Choose the prayers you want to practice below.'
    : carDone ? 'Press play to start again from the beginning.'
    : carReps > 1 ? 'Playing ' + carPlay + ' of ' + carReps + ' times' : '';
  const playing = !carAudio.paused;
  $('cplay').innerHTML = playing ? CAR_PAUSE : CAR_PLAY;
  $('cplay').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  $('cnextbtn').disabled = empty || carIdx >= list.length - 1;
  $('crepsv').textContent = carReps + '\u00D7';
  $('crepdown').disabled = carReps <= 1;
  $('crepup').disabled = carReps >= 10;
  if (carListIdxShown !== carIdx) {
    document.querySelectorAll('#clist .citem').forEach((el, i) => {
      el.classList.toggle('on', i === carIdx);
      if (i === carIdx) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
    });
    carListIdxShown = carIdx;
  }
  carTime();
}

// After the active list changes: keep the current prayer if it's still in the list;

  const list = carList();

  if (i !== -1) carIdx = i;

    carAudio.pause(); carKeepAwake(false);
    carLoadedId = null; carIdx = 0; carPlay = 1; carDone = false;
    if (list.length) carLoad(0, false);

  if (m === carMode) return;
  carMode = m;
  try { localStorage.setItem('tt-carmode', m); } catch (e) {}
  carEditing = m === 'mine' && !carList().length; // empty playlist: open the chooser right away

// Update the player after picks change, leaving the chooser in place.
function carSync() {
  const m = document.getElementById('cmode'); if (m) m.innerHTML = carModeHtml();
  if (carMode !== 'mine') return;
  const list = carList();
  const i = list.indexOf(carLoadedId);
  if (i !== -1) carIdx = i;
  else {
    carAudio.pause(); carKeepAwake(false);
    carLoadedId = null; carIdx = 0; carPlay = 1; carDone = false;
    if (list.length) carLoad(0, false);
    else { carAudio.removeAttribute('src'); try { carAudio.load(); } catch (e) {} }
  }
  carUpdate();
}

function carWire() {
  carListIdxShown = -1;
  const s = document.getElementById('cseek');
  if (s) {
    s.addEventListener('input', () => { carSeeking = true; document.getElementById('ccur').textContent = fmt(+s.value); });
    s.addEventListener('change', () => { try { carAudio.currentTime = +s.value; } catch (e) {} carSeeking = false; });
  }
  if (!carLoadedId && carList().length) carLoad(carIdx, false); else carUpdate();
}

// Lock screen, headphone and car steering-wheel buttons (where the browser supports it).
function carMedia() {
  if (!('mediaSession' in navigator)) return;
  const p = byId[carList()[carIdx]];
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: p ? p.name : "T'fillah Trainer", artist: 'Temple Beth El', album: "T'fillah Trainer" });
  } catch (e) {}
}
function carHandlers(on) {
  if (!('mediaSession' in navigator)) return;
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, on ? f : null); } catch (e) {} };
  set('play', carStart); set('pause', carPause); set('nexttrack', carNext);
  set('previoustrack', carRestartPrayer); set('seekbackward', carBack10);
}
// Keep the screen awake while the playlist plays, so the big buttons stay ready.
async function carKeepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !carWake) {
      carWake = await navigator.wakeLock.request('screen');
      carWake.addEventListener('release', () => { carWake = null; });
    } else if (!on && carWake) { await carWake.release(); carWake = null; }
  } catch (e) { carWake = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !carAudio.paused) carKeepAwake(true);
});

/* ================================================================
   VOWEL QUIZ: a letter with a vowel; pick the sound it makes.
   Uses the same letter and vowel sounds as the Alef Bet tab.
   ================================================================ */
const QUIZ_SOUNDS = ['ah', 'ay', 'eh', 'ee', 'oh', 'oo'];
let quiz = null;
let quizScore = { right: 0, total: 0, streak: 0 };

function quizShuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function quizOk(li, vi) {
  const L = WHEELS[li][2], V = WHEEL_VOWELS[vi];
  if (V[1] === "'") return false;                                   // Sh'va: its sound depends on the word
  if (L === 'Vav' && V[2] === 'Cholam') return false;              // would look like Cholam Vav
  if ((L === 'Shin' || L === 'Sin') && V[2] === 'Cholam') return false; // dots run together
  return true;
}
function quizNew() {
  let li, vi, t = 0;
  do {
    li = Math.floor(Math.random() * WHEELS.length);
    vi = Math.floor(Math.random() * WHEEL_VOWELS.length);
    t++;
  } while ((!quizOk(li, vi) || (quiz && quiz.li === li && quiz.vi === vi)) && t < 100);
  const c = WHEELS[li][1], s = WHEEL_VOWELS[vi][1];
  const wrong = quizShuffle(QUIZ_SOUNDS.filter((x) => x !== s)).slice(0, 3);
  quiz = { li, vi, answer: c + s, options: quizShuffle([s].concat(wrong)).map((x) => c + x), picked: null };
}
function quizPick(i) {
  if (!quiz || quiz.picked !== null) return;
  quiz.picked = i;
  const ok = quiz.options[i] === quiz.answer;
  quizScore.total++;
  if (ok) { quizScore.right++; quizScore.streak++; } else quizScore.streak = 0;
  quizRender();
  const nb = document.getElementById('qnextbtn');
  if (nb) nb.focus({ preventScroll: true });
}
function quizNext() { quizNew(); quizRender(); }
function quizReset() { quizScore = { right: 0, total: 0, streak: 0 }; quizNew(); quizRender(); }

function quizRender() {
  const g = document.getElementById('qglyph');
  if (!g || !quiz) return;
  const L = WHEELS[quiz.li], V = WHEEL_VOWELS[quiz.vi];
  g.innerHTML = L[0] + V[0];
  g.setAttribute('aria-label', L[2] + ' with ' + V[2]);
  const answered = quiz.picked !== null;
  document.getElementById('qopts').innerHTML = quiz.options.map((o, i) => {
    let cls = 'qopt';
    if (answered && o === quiz.answer) cls += ' right';
    else if (answered && i === quiz.picked) cls += ' wrong';
    return '<button class="' + cls + '" onclick="quizPick(' + i + ')"' + (answered ? ' disabled' : '') + '>' + o + '</button>';
  }).join('');
  const f = document.getElementById('qfeed');
  if (!answered) f.innerHTML = '';
  else {
    const ok = quiz.options[quiz.picked] === quiz.answer;
    const why = L[1] === '' ? L[2] + ' is silent, so with ' + V[2] + ' it says \u201C' + quiz.answer + '\u201D.'
      : L[2] + ' with ' + V[2] + ' says \u201C' + quiz.answer + '\u201D.';
    const vinfo = VOWELS.find((v) => v[1] === V[2]);
    f.innerHTML = (ok ? '<span class="ok">Correct!</span> ' : '<span class="no">Not quite.</span> ') + esc(why) +
      (vinfo ? '<br>' + esc(V[2] + ' sounds like ' + vinfo[2] + '.') : '');
  }
  document.getElementById('qnextbtn').style.visibility = answered ? 'visible' : 'hidden';
  document.getElementById('qright').textContent = quizScore.right;
  document.getElementById('qtotal').textContent = quizScore.total;
  document.getElementById('qstreak').textContent = quizScore.streak;
}

function quizHtml() {
  return '<div class="quiz">' +
    '<div class="qscore"><span>Correct <b id="qright">0</b> of <b id="qtotal">0</b></span><span>Streak <b id="qstreak">0</b></span></div>' +
    '<div class="qcard"><span class="qglyph" id="qglyph" role="img"></span></div>' +
    '<p class="qprompt">What sound does this make?</p>' +
    '<div class="qopts" id="qopts"></div>' +
    '<p class="qfeed" id="qfeed" aria-live="polite"></p>' +
    '<div class="qnext"><button class="fbtn" id="qnextbtn" onclick="quizNext()">Next question</button></div>' +
    '<p class="qreset"><button class="chip" onclick="quizReset()">Reset score</button></p>' +
    '</div>';
}
// Keyboard: 1-4 to answer, Enter for the next question.
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('qopts') || !quiz) return;
  if (quiz.picked === null && /^[1-4]$/.test(e.key)) quizPick(+e.key - 1);
  else if (quiz.picked !== null && e.key === 'Enter' && document.activeElement !== document.getElementById('qnextbtn')) quizNext();
});

// On phones, bring the whole player (or quiz) into view when the tab opens, so every big
// button is on screen without scrolling. Scrolling up still reaches the tabs.
function panelIntoView(topSel, endSel) {
  requestAnimationFrame(() => {
    const top = document.querySelector(topSel), end = document.querySelector(endSel);
    if (!top || !end) return;
    if (end.getBoundingClientRect().bottom > window.innerHeight - 8) {
      window.scrollTo(0, Math.max(0, top.getBoundingClientRect().top + window.scrollY - 10));
    }
  });
}

showList();
