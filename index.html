<!DOCTYPE html>
<html lang="en">
<head>

<title>T'fillah Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bona+Nova:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');
  * { box-sizing: border-box; }
  /* Prayer text uses the PDF's own letter shapes (see .hwd). Other Hebrew uses David, which the PDF

  :root { --heb: 'David', 'Bona Nova', 'Frank Ruhl Libre', serif; }

  body.hide-tr .ph-tr { display: none; }

  .phrase.fcur.settle { transition: transform .16s ease-in, opacity .16s ease-in; }
  .phrase.fcur.in-next { animation: tt-in-next .2s ease-out; }

  @keyframes tt-in-prev { from { transform: translateX(-48px); opacity: 0; } to { transform: none; opacity: 1; } }
  html.tt-lock, html.tt-lock body { overflow: hidden; overscroll-behavior: none; }

  .dchip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px 7px 12px; border-radius: 999px;

  .dchip:has(input:focus-visible) { outline: 2px solid #C9A227; outline-offset: 1px; }

  /* Prayer Hebrew is drawn with the PDF's own word shapes, so it matches the class PDF exactly.

  .hwd { display: inline-block; height: 1.3500em; width: auto; vertical-align: -0.5654em; overflow: visible; }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;

  .seek { display: flex; align-items: center; gap: 10px; }
  .seek input { flex: 1; accent-color: #C9A227; }

  /* ---------- tabs: 3 across, 2 rows ---------- */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
  .tab { --tl: rgba(201,162,39,0.3); box-shadow: inset -1px 0 0 var(--tl), inset 0 -1px 0 var(--tl); }

function headerHtml() {
  return (PREVIEW ? '<div style="text-align:center;background:#C9A227;color:#0C1530;font-size:12px;letter-spacing:1px;padding:6px 10px;border-radius:6px;margin:14px 0 0;">DESIGN PREVIEW &mdash; audio plays on the live site</div>' : '') +

    "<h1>T'fillah Trainer</h1>" +
    '<p class="sub">Practice reading the Hebrew and sing along with your cantor</p></div>' +
    '<hr class="rule">';
}

function tabsHtml() {
  let h = '<div class="tabs">';
  for (const v in VIEWS) {
    h += '<button class="tab' + (v === currentView ? ' on' : '') + '" onclick="setView(\'' + v + '\')">' + VIEWS[v].label + '</button>';
  }
  return h + '</div>';
}

function setView(v) { currentView = v; showList(); }

function sortPinnedFirst(ids) {
  const arr = [...ids];
  arr.sort((a, b) => (pinned.has(b) ? 1 : 0) - (pinned.has(a) ? 1 : 0));
  return arr;
}

function footerHtml() {
  return '<div class="footer">This website is for practice only.<br>' +
    'Site is under construction. Please send any errors, feedback, or requests to ' +
    '<a href="mailto:ana.galvan345@gmail.com">ana.galvan345@gmail.com</a>.</div>';
}

function showList(keepScroll) {
  setPageLock(false);
  document.body.style.paddingBottom = '';
  const prevY = window.scrollY;
  audio.pause();
  bar.style.display = 'none';
  let html = headerHtml() + tabsHtml() +
    (VIEWS[currentView].desc ? '<p class="viewdesc">' + VIEWS[currentView].desc + '</p>' : '');

  if (currentView !== 'play') carStop();
  if (currentView !== 'bm') bmEditing = false;
  if (currentView === 'bm' && (bmEditing || !bmIds().length)) {
    html += bmChooserHtml() + footerHtml();
    root.innerHTML = html;
    window.scrollTo(0, keepScroll ? prevY : 0);
    return;
  }
  if (currentView === 'bm') {
    const n = bmIds().length;
    html += '<div class="bmbar"><span>' + n + ' prayer' + (n === 1 ? '' : 's') + '</span>' +
      '<button class="chip gold" onclick="bmSetEditing(true)">Edit my prayers</button></div>';
  }
  if (currentView === 'play') {
    html += carHtml() + footerHtml();
    root.innerHTML = html;
    carWire();
    window.scrollTo(0, keepScroll ? prevY : 0);
    if (!keepScroll) panelIntoView('.car', '.creps');
    return;
  }
  if (currentView === 'quiz') {
    html += quizHtml() + footerHtml();
    root.innerHTML = html;
    if (!quiz) quizNew();
    quizRender();
    window.scrollTo(0, keepScroll ? prevY : 0);
    if (!keepScroll) panelIntoView('.quiz', '.qnext');
    return;
  }
  if (currentView === 'alefbet') {
    html += alefbetHtml() + footerHtml();
    root.innerHTML = html;
    wireAlefbet();
    wireWheels();
    window.scrollTo(0, keepScroll ? prevY : 0);
    return;
  }

  if (currentView === 'siddur') {
    html += '<div class="toc">';
    for (const id of VIEWS.siddur.ids()) {
      const p = byId[id];
      if (!p) continue;
      html += '<button class="tocitem" onclick="showPrayer(\'' + id + '\')">' + esc(p.name) +
        '</button>';
    }
    html += '</div>';
  }

  for (const id of sortPinnedFirst(VIEWS[currentView].ids())) {
    const p = byId[id];
    if (!p) continue;
    const pagePill = '';
    const audioPill = (audioAvail.has(id) ? '<span class="pill">Audio</span>' : '') +
      (p.phrases.length ? '' : '<span class="pill dim">Listen only</span>');
    html += '<div class="card" role="button" tabindex="0" onclick="showPrayer(\'' + id + '\')">' +
      '<button class="pinbtn' + (pinned.has(id) ? ' on' : '') + '" title="Pin to top" aria-label="Pin to top" onclick="togglePin(event, \'' + id + '\')">' + ICON_PIN + '</button>' +
      '<span><span class="cname">' + esc(p.name) + '</span>' +
      '<span class="cdesc" style="display:block">' + esc(p.desc) + '</span>' +
      '<span style="display:block">' + pagePill + audioPill + '</span>' +

    document.body.classList.toggle('hide-tr', !showTr);

  if (fm) fm.addEventListener('change', () => {

// Prayer Hebrew: the PDF's word shapes (exact match), with the text kept for screen readers.
function heHtml(ph) {

    '</span><span class="sr">' + ph.he + '</span>';

    '<p class="ph-he">' + heHtml(ph) + '</p>' +

function toggleLineTr(el) {

function renderPBody() {
  const p = byId[currentPrayerId];

/* ---------- focus mode swipe ----------
   Swipe left = next line, swipe right = previous line.
   Vertical scrolling still works because the card only claims horizontal drags. */
const ICON_SWIPE_L = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>';
const ICON_SWIPE_R = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
let focusEnter = 0;
let swipeLock = false;

function wireSwipe(card) {
  let x0 = 0, y0 = 0, dx = 0, mode = null, pid = null;
  card.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; dx = 0; mode = null; pid = e.pointerId;
  });
  card.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!mode) {
      if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) {
        mode = 'h'; swipeLock = true;
        try { card.setPointerCapture(pid); } catch (err) {}
      } else if (Math.abs(my) > 10) { mode = 'v'; }
    }
    if (mode === 'h') {
      const n = byId[currentPrayerId].phrases.length;
      const atEnd = (mx > 0 && focusIdx === 0) || (mx < 0 && focusIdx === n - 1);
      dx = atEnd ? mx * 0.25 : mx; // resist at the first and last line
      card.style.transform = 'translateX(' + dx + 'px)';
    }
  });
  const end = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (mode !== 'h') { mode = null; return; }
    mode = null;
    const n = byId[currentPrayerId].phrases.length;
    const d = dx < -50 ? 1 : dx > 50 ? -1 : 0;
    const ok = d !== 0 && focusIdx + d >= 0 && focusIdx + d < n;
    card.classList.add('settle');
    if (ok) {
      card.style.transform = 'translateX(' + (d > 0 ? '-110%' : '110%') + ')';
      card.style.opacity = '0';
      setTimeout(() => { focusEnter = d; focusStep(d); }, 160);
    } else {
      card.style.transform = '';
    }
    setTimeout(() => { swipeLock = false; }, 60);
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

// Keyboard: left and right arrow keys also change lines in focus mode.
document.addEventListener('keydown', (e) => {
  if (!document.querySelector('#pbody .phrase.fcur')) return;
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') return;
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  const n = byId[currentPrayerId].phrases.length;
  if (!d || focusIdx + d < 0 || focusIdx + d >= n) return;
  focusEnter = d; focusStep(d);
});

/* ---------- focus mode page lock ----------
   In focus mode the page stays still: it settles with the toggles at the top,
   then stops scrolling. Long lines shrink to fit above the player.
   Turning focus mode off (or going back) unlocks it. */
let pageLocked = false;
function setPageLock(on) {
  pageLocked = on;
  document.documentElement.classList.toggle('tt-lock', on);
  if (!on) document.body.style.minHeight = '';
}
// iPhone needs this as well as overflow:hidden. The audio player stays draggable.
document.addEventListener('touchmove', (e) => {
  if (pageLocked && !(e.target.closest && e.target.closest('.player'))) e.preventDefault();
}, { passive: false });

function fitFocusCard() {
  const card = document.querySelector('#pbody .phrase.fcur');
  if (!card) return;
  const he = card.querySelector('.ph-he');
  he.style.fontSize = '';
  const dock = document.getElementById('tdock');
  const limit = (dock ? dock.getBoundingClientRect().top
    : bar.style.display !== 'none' ? bar.getBoundingClientRect().top : window.innerHeight) - 12;
  let size = parseFloat(getComputedStyle(he).fontSize);
  while (card.getBoundingClientRect().bottom > limit && size > 22) {
    size -= 2;
    he.style.fontSize = size + 'px';
  }
}

function lockFocusView() {
  placeDock();
  if (!document.querySelector('#pbody .phrase.fcur')) return;
  setPageLock(false);
  const row = document.getElementById('fbar') || document.querySelector('.trrow');
  const target = row ? Math.max(0, row.getBoundingClientRect().top + window.scrollY - 12) : 0;
  // make the page tall enough to reach the same spot for every line, so it never jumps
  document.body.style.minHeight = (target + window.innerHeight) + 'px';
  window.scrollTo(0, target);
  fitFocusCard();

}
window.addEventListener('resize', () => { if (pageLocked) lockFocusView(); });
document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'trtoggle' && pageLocked) requestAnimationFrame(fitFocusCard);
});

const ICON_BACK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>';
const ICON_HOME = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>';

// Focus mode Back: turn focus mode off and bring the user to the line they were on.
// Both the Back button and the Focus mode switch go through the switch's change handler,
// which calls returnToLine, so they behave the same.
function exitFocus() {
  const fm = document.getElementById('fmtoggle');
  if (fm && fm.checked) { fm.checked = false; fm.dispatchEvent(new Event('change')); }
}
// Scroll the full prayer to a line and briefly highlight it.
function returnToLine(line) {
  requestAnimationFrame(() => {
    const el = document.querySelectorAll('#pbody .pblock .phrase')[line];

    lastReturn = { id: currentPrayerId, line, y: window.scrollY };

    setTimeout(() => el.classList.remove('tt-here'), 1900);

/* ---------- toggle dock ----------
   Transliteration and Focus mode stay reachable while scrolling: a small dock sits just
   above the audio player (or at the bottom of the screen when there's no recording). */
function dockHtml(id) {
  return '<div class="tdock" id="tdock" role="group" aria-label="Display options">' +
    '<label class="dchip"><span>Transliteration</span><span class="switch sm"><input type="checkbox" id="trtoggle"' +
    (showTr ? ' checked' : '') + '><span class="knob"></span></span></label>' +
    '<span class="ddiv" aria-hidden="true"></span>' +
    '<label class="dchip"><span>Focus mode</span><span class="switch sm"><input type="checkbox" id="fmtoggle"' +

    '</div>';

function placeDock() {

window.addEventListener('resize', placeDock);
// The line nearest the top of the reading area, so focus mode opens where the reader is.
let lastReturn = null;
function readingLine() {
  // if they haven't scrolled since leaving focus mode, pick up exactly where they left off
  if (lastReturn && lastReturn.id === currentPrayerId && Math.abs(window.scrollY - lastReturn.y) < 4) return lastReturn.line;
  const lines = document.querySelectorAll('#pbody .pblock .phrase');

function focusStep(d) {

}


/* ---------- Alef Bet tab ---------- */

// [glyph, sound, name] plus optional [finalGlyph, finalName] for letters
// that have a final (sofit) form.
const WHEELS = [
  ["\u05D0","","Alef"],["\u05D1\u05BC","b","Bet"],["\u05D1","v","Vet"],["\u05D2","g","Gimel"],
  ["\u05D3","d","Dalet"],["\u05D4","h","Hei"],["\u05D5","v","Vav"],["\u05D6","z","Zayin"],
  ["\u05D7","ch","Chet"],["\u05D8","t","Tet"],["\u05D9","y","Yod"],["\u05DB\u05BC","k","Kaf"],
  ["\u05DB","ch","Chaf","\u05DA","Final Chaf"],["\u05DC","l","Lamed"],
  ["\u05DE","m","Mem","\u05DD","Final Mem"],["\u05E0","n","Nun","\u05DF","Final Nun"],
  ["\u05E1","s","Samech"],["\u05E2","","Ayin"],["\u05E4\u05BC","p","Pei"],
  ["\u05E4","f","Fei","\u05E3","Final Fei"],
  ["\u05E6","tz","Tzadi","\u05E5","Final Tzadi"],["\u05E7","k","Kof"],["\u05E8","r","Reish"],["\u05E9\u05C1","sh","Shin"],
  ["\u05E9\u05C2","s","Sin"],["\u05EA","t","Tav"],
];
let wheelPos = WHEELS.map(() => 0);
let wheelSayOn = WHEELS.map(() => true);
let wheelFinal = WHEELS.map(() => false); // false = regular form, true = final form

// Helpers: a wheel has a final form when the row carries a 4th entry.
function wheelHasFinal(i) { return WHEELS[i].length > 3; }
function wheelGlyph(i) { return wheelFinal[i] ? WHEELS[i][3] : WHEELS[i][0]; }
function wheelAltGlyph(i) { return wheelFinal[i] ? WHEELS[i][0] : WHEELS[i][3]; }
function wheelName(i) { return wheelFinal[i] ? WHEELS[i][4] : WHEELS[i][2]; }

function toggleWheelFinal(i, v) {
  wheelFinal[i] = v;
  const wrap = document.getElementById('wh' + i);
  if (!wrap) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = wheelItemHtml(i);

}
function toggleWheelSay(i, v) {

}
let wheelPins = new Set();
try { wheelPins = new Set(JSON.parse(localStorage.getItem('tt-wpins') || '[]')); } catch (e) {}
function saveWheelPins() { try { localStorage.setItem('tt-wpins', JSON.stringify([...wheelPins])); } catch (e) {} }

let deck = new Set();
try { deck = new Set(JSON.parse(localStorage.getItem('tt-deck') || '[]')); } catch (e) {}
function saveDeck() { try { localStorage.setItem('tt-deck', JSON.stringify([...deck])); } catch (e) {} }
let deckIdx = 0, deckFlip = false, deckOrder = [];

function deckItems() {
  const items = [];
  ALEFBET.forEach(([g, n, s], i) => { if (deck.has('L' + i)) items.push({ g, n, s }); });
  VOWELS.forEach(([g, n, s], i) => { if (deck.has('V' + i)) items.push({ g, n, s }); });
  return items;
}

function toggleDeck(kind, i) {
  const key = kind + i;
  if (deck.has(key)) deck.delete(key); else deck.add(key);
  saveDeck();
  deckIdx = 0; deckFlip = false; deckOrder = [];

}

function alefbetHtml() {
  let h = '<div style="text-align:center;margin:0 0 14px;"><button class="chip" onclick="document.getElementById(\'practice\').scrollIntoView({behavior:\'smooth\'})">Jump to practice section</button></div>' +

function wheelGeom() {
  const cx = 180, cy = -2, r = 150, rt = 186, a0 = 28, a1 = 152, n = WHEEL_VOWELS.length;
  const pt = (rad_, deg) => {
    const rad = deg * Math.PI / 180;
    return [cx + rad_ * Math.cos(rad), cy + rad_ * Math.sin(rad)];
  };
  const ticks = [];
  for (let i = 0; i < n; i++) {
    const deg = a0 + (a1 - a0) * i / (n - 1);
    ticks.push(pt(rt, deg)); // just beneath the curve
  }
  let d = '';
  for (let deg = a0; deg <= a1; deg += 4) {
    const [x, y] = pt(r, deg);
    d += (d ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  // arrowheads past each end of the curve
  const arrow = (endDeg, dir) => {
    const tip = pt(r, endDeg + 7 * dir);
    const b1 = pt(r - 11, endDeg + 1.5 * dir);
    const b2 = pt(r + 11, endDeg + 1.5 * dir);
    return '<polygon class="warr" points="' + tip[0].toFixed(1) + ',' + tip[1].toFixed(1) + ' ' +
      b1[0].toFixed(1) + ',' + b1[1].toFixed(1) + ' ' + b2[0].toFixed(1) + ',' + b2[1].toFixed(1) + '"></polygon>';
  };
  const arrows = arrow(a0, -1) + arrow(a1, 1);
  return { ticks, d, arrows };
}
const WGEOM = wheelGeom();

function wheelVowelLabel(v) {
  const [vm, vs, vn, suffix] = v;
  return suffix ? vm : '\u25CC' + vm; // dotted circle carries the bare vowel mark
}

function wheelSay(i) {
  const lc = WHEELS[i][1];
  const vs = WHEEL_VOWELS[wheelPos[i]][1];
  if (lc === '') return vs === "'" ? "'" : vs;
  return vs === "'" ? lc + "'" : lc + vs;
}

function wheelItemHtml(i) {
  const [vm, vs, vn] = WHEEL_VOWELS[wheelPos[i]];
  let ticksHtml = '';
  WGEOM.ticks.forEach(([x, y], vi) => {
    ticksHtml += '<g class="wtick' + (vi === wheelPos[i] ? ' on' : '') + '" data-v="' + vi + '">' +
      '<text x="' + x + '" y="' + (y + 15) + '" text-anchor="middle">' + wheelVowelLabel(WHEEL_VOWELS[vi]) + '</text></g>';
  });
  const finalCtrl = wheelHasFinal(i)
    ? '<span class="finalctrl"><span class="flbl">reg</span>' +
      '<label class="switch sm" title="Switch between the regular and final form"><input type="checkbox"' + (wheelFinal[i] ? ' checked' : '') + ' onchange="toggleWheelFinal(' + i + ', this.checked)"><span class="knob"></span></label>' +
      '<span class="flbl">final</span><span class="fglyph">' + wheelAltGlyph(i) + '</span></span>'
    : '';
  return '<div class="wheelitem' + (wheelSayOn[i] ? '' : ' nosay') + (wheelHasFinal(i) ? ' hasfinal' : '') + '" id="wh' + i + '">' +
    '<span class="wname" id="whn' + i + '"><span class="wn-letter">' + wheelName(i) + '</span><span class="wn-vowel">' + vn + '</span></span>' +

function updateWheelDisplay(i) {
  const [vm, vs, vn] = WHEEL_VOWELS[wheelPos[i]];
  const s = document.getElementById('whs' + i);
  const n = document.getElementById('whn' + i);
  const p = document.getElementById('whp' + i);
  if (s) s.textContent = wheelGlyph(i) + vm;
  if (n) n.innerHTML = '<span class="wn-letter">' + wheelName(i) + '</span><span class="wn-vowel">' + vn + '</span>';
  if (p) p.textContent = '\u201C' + wheelSay(i) + '\u201D';
  document.querySelectorAll('#wh' + i + ' .wtick').forEach((g) => {
    g.classList.toggle('on', parseInt(g.dataset.v, 10) === wheelPos[i]);
  });
}

function wireOneWheel(i) {
  const svg = document.querySelector('#wh' + i + ' .warc');
  if (!svg) return;
  const handle = (e) => {
    if (e.pointerType === 'mouse' && e.buttons === 0) return;
    if (e.cancelable) e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (360 / rect.width);
    const py = 40 + (e.clientY - rect.top) * (200 / rect.height);
    let deg = Math.atan2(py + 2, px - 180) * 180 / Math.PI;
    if (deg < 0) deg = deg < -90 ? 152 : 28;
    deg = Math.max(28, Math.min(152, deg));
    const idx = Math.round((deg - 28) / ((152 - 28) / (WHEEL_VOWELS.length - 1)));
    if (idx !== wheelPos[i]) { wheelPos[i] = idx; updateWheelDisplay(i); }
  };
  svg.addEventListener('pointerdown', handle);
  svg.addEventListener('pointermove', handle);
  svg.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  svg.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
}

function wireWheels() {
  document.querySelectorAll('.warc').forEach((svg) => {
    wireOneWheel(parseInt(svg.dataset.i, 10));

}

const CI = (d, size, fill) => '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="' + (fill ? 'currentColor' : 'none') +

function carLoad(i, play) {
  const list = carList();

  carDone = false;

  else { try { carAudio.currentTime = 0; } catch (e) {} }

function carStart() {
  if (!carList().length) return;
  if (carDone) { carLoad(0, false); }
  else if (!carLoadedId) { carLoad(carIdx, false); }
  const p = carAudio.play();
  if (p && p.catch) p.catch(() => {});
  carKeepAwake(true);
  carHandlers(true);

}
function carPause() { carAudio.pause(); carKeepAwake(false); carUpdate(); }
function carToggle() { if (carAudio.paused) carStart(); else carPause(); }

}

carAudio.addEventListener('ended', () => {

    carPlay++;
    try { carAudio.currentTime = 0; } catch (e) {}
    const p = carAudio.play(); if (p && p.catch) p.catch(() => {});
  } else if (carIdx < carList().length - 1) {
    carLoad(carIdx + 1, true);         // on to the next prayer
    return;
  } else {
    carDone = true;                    // end of the playlist
    carKeepAwake(false);
  }
  carUpdate();
});

// Lock screen, headphone and car steering-wheel buttons (where the browser supports it).
function carMedia() {
  if (!('mediaSession' in navigator)) return;

      title: p ? p.name : "T'fillah Trainer", artist: 'Temple Beth El', album: "T'fillah Trainer" });

}
function carHandlers(on) {
  if (!('mediaSession' in navigator)) return;
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, on ? f : null); } catch (e) {} };
  set('play', carStart); set('pause', carPause); set('nexttrack', carNext);
  set('previoustrack', carRestartPrayer); set('seekbackward', carBack10);

// Keep the screen awake while the playlist plays, so the big buttons stay ready.
async function carKeepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !carWake) {
      carWake = await navigator.wakeLock.request('screen');
      carWake.addEventListener('release', () => { carWake = null; });
    } else if (!on && carWake) { await carWake.release(); carWake = null; }
  } catch (e) { carWake = null; }
}

/* ================================================================
   VOWEL QUIZ: a letter with a vowel; pick the sound it makes.
   Uses the same letter and vowel sounds as the Alef Bet tab.
   ================================================================ */
const QUIZ_SOUNDS = ['ah', 'ay', 'eh', 'ee', 'oh', 'oo'];
let quiz = null;
let quizScore = { right: 0, total: 0, streak: 0 };

function quizShuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function quizOk(li, vi) {
  const L = WHEELS[li][2], V = WHEEL_VOWELS[vi];
  if (V[1] === "'") return false;                                   // Sh'va: its sound depends on the word
  if (L === 'Vav' && V[2] === 'Cholam') return false;              // would look like Cholam Vav
  if ((L === 'Shin' || L === 'Sin') && V[2] === 'Cholam') return false; // dots run together
  return true;
}
function quizNew() {
  let li, vi, t = 0;
  do {
    li = Math.floor(Math.random() * WHEELS.length);
    vi = Math.floor(Math.random() * WHEEL_VOWELS.length);
    t++;
  } while ((!quizOk(li, vi) || (quiz && quiz.li === li && quiz.vi === vi)) && t < 100);
  const c = WHEELS[li][1], s = WHEEL_VOWELS[vi][1];
  const wrong = quizShuffle(QUIZ_SOUNDS.filter((x) => x !== s)).slice(0, 3);
  quiz = { li, vi, answer: c + s, options: quizShuffle([s].concat(wrong)).map((x) => c + x), picked: null };
}
function quizPick(i) {
  if (!quiz || quiz.picked !== null) return;
  quiz.picked = i;
  const ok = quiz.options[i] === quiz.answer;
  quizScore.total++;
  if (ok) { quizScore.right++; quizScore.streak++; } else quizScore.streak = 0;
  quizRender();
  const nb = document.getElementById('qnextbtn');
  if (nb) nb.focus({ preventScroll: true });
}
function quizNext() { quizNew(); quizRender(); }
function quizReset() { quizScore = { right: 0, total: 0, streak: 0 }; quizNew(); quizRender(); }

function quizRender() {
  const g = document.getElementById('qglyph');
  if (!g || !quiz) return;
  const L = WHEELS[quiz.li], V = WHEEL_VOWELS[quiz.vi];
  g.innerHTML = L[0] + V[0];
  g.setAttribute('aria-label', L[2] + ' with ' + V[2]);
  const answered = quiz.picked !== null;
  document.getElementById('qopts').innerHTML = quiz.options.map((o, i) => {
    let cls = 'qopt';
    if (answered && o === quiz.answer) cls += ' right';
    else if (answered && i === quiz.picked) cls += ' wrong';
    return '<button class="' + cls + '" onclick="quizPick(' + i + ')"' + (answered ? ' disabled' : '') + '>' + o + '</button>';
  }).join('');
  const f = document.getElementById('qfeed');
  if (!answered) f.innerHTML = '';
  else {
    const ok = quiz.options[quiz.picked] === quiz.answer;
    const why = L[1] === '' ? L[2] + ' is silent, so with ' + V[2] + ' it says \u201C' + quiz.answer + '\u201D.'
      : L[2] + ' with ' + V[2] + ' says \u201C' + quiz.answer + '\u201D.';
    const vinfo = VOWELS.find((v) => v[1] === V[2]);
    f.innerHTML = (ok ? '<span class="ok">Correct!</span> ' : '<span class="no">Not quite.</span> ') + esc(why) +
      (vinfo ? '<br>' + esc(V[2] + ' sounds like ' + vinfo[2] + '.') : '');
  }
  document.getElementById('qnextbtn').style.visibility = answered ? 'visible' : 'hidden';
  document.getElementById('qright').textContent = quizScore.right;
  document.getElementById('qtotal').textContent = quizScore.total;
  document.getElementById('qstreak').textContent = quizScore.streak;
}

function quizHtml() {
  return '<div class="quiz">' +
    '<div class="qscore"><span>Correct <b id="qright">0</b> of <b id="qtotal">0</b></span><span>Streak <b id="qstreak">0</b></span></div>' +
    '<div class="qcard"><span class="qglyph" id="qglyph" role="img"></span></div>' +
    '<p class="qprompt">What sound does this make?</p>' +
    '<div class="qopts" id="qopts"></div>' +
    '<p class="qfeed" id="qfeed" aria-live="polite"></p>' +
    '<div class="qnext"><button class="fbtn" id="qnextbtn" onclick="quizNext()">Next question</button></div>' +
    '<p class="qreset"><button class="chip" onclick="quizReset()">Reset score</button></p>' +
    '</div>';
}
// Keyboard: 1-4 to answer, Enter for the next question.
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('qopts') || !quiz) return;
  if (quiz.picked === null && /^[1-4]$/.test(e.key)) quizPick(+e.key - 1);
  else if (quiz.picked !== null && e.key === 'Enter' && document.activeElement !== document.getElementById('qnextbtn')) quizNext();
});

// On phones, bring the whole player (or quiz) into view when the tab opens, so every big
// button is on screen without scrolling. Scrolling up still reaches the tabs.
function panelIntoView(topSel, endSel) {
  requestAnimationFrame(() => {
    const top = document.querySelector(topSel), end = document.querySelector(endSel);
    if (!top || !end) return;
    if (end.getBoundingClientRect().bottom > window.innerHeight - 8) {
      window.scrollTo(0, Math.max(0, top.getBoundingClientRect().top + window.scrollY - 10));
    }
  });
}

/* ================================================================
   B'NAI MITZVAH PRACTICE: each person builds this tab by choosing
   prayers from the class siddur. Saved on their own device.
   ================================================================ */
let bmChosen = new Set();
try { bmChosen = new Set(JSON.parse(localStorage.getItem('tt-bm') || '[]')); } catch (e) {}
function saveBm() { try { localStorage.setItem('tt-bm', JSON.stringify([...bmChosen])); } catch (e) {} }
let bmEditing = false;

// Chosen prayers, in class siddur order.
function bmIds() { return DATA.siddur.map((x) => x.id).filter((id) => bmChosen.has(id) && byId[id]); }

const BM_CHECK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function bmChooserHtml() {
  const any = bmIds().length > 0;
  let h = '<div class="bmpick"><p class="secthead">Choose your prayers</p>' +
    '<p class="sectsub">Tap the prayers you\u2019re practicing. They\u2019ll show up here in class siddur order.</p>' +
    '<div class="cedit"><button class="chip" onclick="bmPickAll(true)">Select all</button>' +
    '<button class="chip" onclick="bmPickAll(false)">Clear all</button>' +
    '<button class="chip gold bmdone" onclick="bmSetEditing(false)"' + (any ? '' : ' hidden') + '>Done</button></div>' +
    '<div class="clist" id="bmlist">';
  for (const { id } of DATA.siddur) {
    const p = byId[id];
    if (!p) continue;
    const on = bmChosen.has(id);
    h += '<button class="citem pick' + (on ? ' in' : '') + '" role="checkbox" aria-checked="' + on + '" data-id="' + id +
      '" onclick="bmToggle(\'' + id + '\')"><span class="cbox">' + BM_CHECK + '</span>' +
      '<span class="cnm">' + esc(p.name) + '</span>' +
      '<span class="chb">' + p.hebrewName + '</span></button>';
  }
  return h + '</div><div class="cedit"><button class="chip gold bmdone" onclick="bmSetEditing(false)"' +
    (any ? '' : ' hidden') + '>Done</button></div></div>';
}

function bmToggle(id) {
  if (bmChosen.has(id)) bmChosen.delete(id); else bmChosen.add(id);
  saveBm();
  const b = document.querySelector('#bmlist .citem[data-id="' + id + '"]');
  if (b) { b.classList.toggle('in', bmChosen.has(id)); b.setAttribute('aria-checked', bmChosen.has(id)); }
  bmDoneButtons();
}
function bmPickAll(on) {
  bmChosen = on ? new Set(DATA.siddur.map((x) => x.id)) : new Set();
  saveBm();
  document.querySelectorAll('#bmlist .citem').forEach((b) => { b.classList.toggle('in', on); b.setAttribute('aria-checked', on); });
  bmDoneButtons();
}
function bmDoneButtons() {
  const any = bmIds().length > 0;
  document.querySelectorAll('.bmdone').forEach((b) => { b.hidden = !any; });
}
function bmSetEditing(on) {
  bmEditing = on;
  showList();
}
